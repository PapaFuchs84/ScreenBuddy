<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FuchsLabs USB-Display</title>
<link rel="icon" href="data:image/svg+xml,<svg viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'><rect width='64' height='64' rx='14' fill='%23f77f00'/><path fill='%23fff4e6' d='M9 7L25 19H39L55 7V31L32 57L9 31Z'/><path fill='%23b05200' d='M13 14L22 21L13 26ZM51 14L42 21L51 26Z'/><path fill='%23fdd6aa' d='M9 31L27 38L32 57ZM55 31L37 38L32 57Z'/><path fill='%2314213d' d='M28 51H36L32 57ZM21 30L25 27L29 30L25 32ZM35 30L39 27L43 30L39 32Z'/></svg>">

<style>
/* FuchsLabs-CI: Fuchs-Orange und Creme als Hauptfarben, Navy als Schrift. Nur Systemschriften. */
:root{--bg:#fff4e6;--card:#fffaf3;--card2:#fae4c8;--line:#eed2b0;--text:#14213d;--muted:#68605c;--orange:#f77f00;--accent:#b05200;
--green:#168c48;--red:#d72d32;--yellow:#8a5a00;--radius:14px;--ink:#14213d;--field:#fff;--okbg:#e4f4ea;--okline:#b5dfc4;--badbg:#fbe5e5;--badline:#f0babb;--head:Bahnschrift,"Segoe UI",system-ui,sans-serif}
/* Dunkelmodus: Navy-Grund, Creme-Schrift; Orange bleibt Hauptfarbe (Seitenleiste, Knöpfe) */
html[data-theme=dunkel]{--bg:#0e1628;--card:#14213d;--card2:#1b2b4d;--line:#27395f;--text:#fff4e6;--muted:#a9b4cb;--accent:#ff9a2e;
--green:#3ccf7a;--red:#ff6266;--yellow:#f0b232;--field:#0e1628;--okbg:#12392a;--okline:#1f6b46;--badbg:#3b1518;--badline:#7a2a30}
aside{--text:#14213d;--bg:#fff4e6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h3,.brand,nav button,.btn,.val,.page .n{font-family:var(--head)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--orange);padding:20px 14px;position:sticky;top:0;height:100vh;
display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:700;font-size:19px;color:var(--text)}
.brand svg{width:34px;height:34px;flex:none}
.brand small{display:block;font-weight:400;color:var(--text);opacity:.8;font-size:12px;font-family:"Segoe UI",system-ui,sans-serif}
nav button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:0;
background:none;padding:10px 12px;border-radius:10px;color:var(--text);cursor:pointer;font-weight:600;font-size:15px}
nav button:hover{background:#ffffff33}
nav button.on{background:var(--bg);color:var(--text);box-shadow:0 2px 0 #b0520040}
nav .dot{width:9px;height:9px;border-radius:50%;border:2px solid #14213d66}
nav .dot.act{background:var(--text);border-color:var(--text)}
.foot{margin-top:auto;color:var(--text);font-size:12px;padding:8px}
main{padding:28px 34px 110px;max-width:980px}
h1{margin:0 0 4px;font-size:28px;font-weight:600}
.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;
box-shadow:0 1px 2px #b0520014}
.card h3{margin:0 0 4px;font-size:17px;font-weight:600}
.card p.hint{margin:0 0 14px;color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .lbl b{display:block;font-weight:600}
.row .lbl span{color:var(--muted);font-size:13px}
input[type=text],input[type=password],input[type=number],select,textarea{background:var(--field);border:1px solid var(--line);
border-radius:10px;padding:9px 12px;min-width:230px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #f77f0033}
textarea{width:100%;min-height:64px;resize:vertical}
input[type=range]{accent-color:var(--orange);width:230px}
.val{min-width:64px;text-align:right;color:var(--accent);font-weight:700}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;cursor:pointer;margin:0;z-index:1}
.sw i{position:absolute;inset:0;background:#e2cdb3;border-radius:26px;transition:.15s}
.sw i:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px #0003}
.sw input:checked+i{background:var(--orange)}
.sw input:checked+i:before{transform:translateX(20px)}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--text)}
.btn:hover{border-color:var(--orange)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.btn.pri:hover{border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-weight:600;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.preview{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start}
.preview img{width:480px;max-width:100%;border-radius:12px;border:6px solid #14213d;background:#14213d;display:block}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:6px 0 12px}
.colors label{display:flex;align-items:center;gap:10px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:600}
.colors label small{display:block;font-weight:400;color:var(--muted);font-family:Consolas,monospace;font-size:12px}
input[type=color]{width:40px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--field);cursor:pointer;flex:none}
.warn{color:var(--yellow);font-weight:600}
.pagelist{display:flex;flex-direction:column;gap:8px}
.page{display:flex;align-items:center;gap:12px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.page .n{width:24px;height:24px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink)}
.page .t{flex:1}.page .t b{display:block}.page .t span{font-size:12px;color:var(--muted)}
.page.off{opacity:.5}
.arrows{display:flex;flex-direction:column;gap:2px}
.arrows button{border:0;background:var(--card2);color:var(--text);border-radius:6px;width:26px;height:18px;line-height:1;cursor:pointer;font-size:11px}
.arrows button:disabled{opacity:.25;cursor:default}
.list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.item{display:flex;align-items:center;gap:12px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.item .t{flex:1;min-width:0}.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:12.5px;color:var(--muted)}
.item .ok{color:var(--green)}.item .bad{color:var(--red)}
.add{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.add input{flex:1;min-width:200px}
.members{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--field);margin-top:10px}
.member{display:flex;align-items:center;gap:12px;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer}
.member:first-child{border-top:0}.member:hover{background:var(--bg)}
.member input{accent-color:var(--orange);width:17px;height:17px}
.member small{color:var(--muted);margin-left:auto}
.ok{color:var(--green)}.bad{color:var(--red)}
.conn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);margin:0 0 12px;font-weight:600}
.conn .d{width:10px;height:10px;border-radius:50%;background:#c9b49a;flex:none}.conn .t{flex:1;min-width:0}
.conn-ok{background:var(--okbg);border-color:var(--okline)}.conn-ok .d{background:var(--green)}.conn-ok .t{color:var(--green)}
.conn-bad{background:var(--badbg);border-color:var(--badline)}.conn-bad .d{background:var(--red)}.conn-bad .t{color:var(--red)}
.conn-off .t{color:var(--muted);font-weight:400}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;background:var(--card2);color:var(--muted)}
.chip.warn{background:#fde9bf;color:var(--yellow)}.chip.good{background:var(--orange);color:var(--ink);font-weight:700}
.note{color:var(--muted);font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-weight:600;padding:6px 0}
.howto{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin-top:12px}
.howto summary{color:var(--accent)}.howto ol{margin:6px 0 10px;padding-left:22px}.howto li{margin:5px 0}
.howto .links{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
a.btn{text-decoration:none;display:inline-block;color:var(--text)}a.btn.pri{color:var(--ink)}.foot a{color:var(--text);font-weight:600}
.bar{position:fixed;left:230px;right:0;bottom:0;background:var(--card);border-top:2px solid var(--orange);padding:14px 34px;
display:flex;align-items:center;gap:14px;transform:translateY(100%);transition:.2s;backdrop-filter:blur(6px)}
.bar.show{transform:none}.bar span{flex:1;color:var(--accent);font-weight:600}
.overlay{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;text-align:center;z-index:9}
.overlay.show{display:grid}.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--orange);
border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;top:18px;right:22px;background:var(--red);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:10}
@media(max-width:1150px){.preview{grid-template-columns:1fr}}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}
.foot,.brand small{display:none}.bar{left:0}.preview{grid-template-columns:1fr}main{padding:20px 16px 110px}}
</style>
</head>

  ['text', 'Schrift'], ['muted', 'Nebentext']];

/* Kontrast nach WCAG, wie auf dem Display gerechnet (render.contrast) */
function contrast(a, b) {
  const lum = x => { const v = [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16) / 255)
    .map(c => c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; };

}
function colorCard() {
  const d = cfg.display, presets = (cache.opts || {}).presets || {};

    if (contrast(c.muted, c.bg) < 3) w.push(T('Nebentext auf Hintergrund'));

          h('button', {class: 'btn', onclick: () => confirm(T('Anzeige neu starten?')) && apply(T('Neustart …'), () => api('/api/restart', {}))}, 'Neu starten'),
          h('button', {class: 'btn', onclick: async () => { if (confirm(T('App beenden? Das Display wird dunkel.'))) { await api('/api/quit', {});
            $('#ovt').textContent = T('App beendet'); $('#ovs').textContent = T('Du kannst dieses Fenster schließen.'); $('#overlay').classList.add('show'); } }}, 'Beenden'))))];
}

const VIEWS = {start: viewStart, overview: viewOverview, friends: viewFriends, discord: viewDiscord, bf6: viewBf6, rss: viewRss, system: viewSystem, display: viewDisplay};
function render() {
  clearInterval(previewTimer); clearInterval(statusTimer); clearInterval(connTimer);
  $('#main').replaceChildren(...VIEWS[tab]().filter(Boolean));
  renderNav();
  $('#foot').replaceChildren(h('a', {href: '/anleitung?lang=' + L, target: '_blank'}, '📖 Bebilderte Anleitung'), h('br'),
    h('a', {href: 'https://www.paypal.me/SHerbst84', target: '_blank', rel: 'noopener noreferrer'}, '☕ Spendier mir einen Kaffee'), h('br'),
    'Version ' + meta.version + ' · © 2026 FuchsLabs');
  if (document.querySelector('.conn')) { updateConn(); connTimer = setInterval(() => document.hidden || updateConn(), 5000); }
  if (tab === 'overview') previewTimer = setInterval(() => { const i = $('#prev'); if (i && !document.hidden) i.src = '/api/preview.png?t=' + Date.now(); }, 2000);
}

async function apply(title, fn) {
  $('#ovt').textContent = title || T('Wird angewendet …');
  $('#ovs').textContent = T('Die Anzeige startet neu, das dauert etwa 10 Sekunden.');
  $('#overlay').classList.add('show');
  const r = await fn();
  if (r && r.ok === false) { $('#overlay').classList.remove('show'); toast(r.error || T('Fehler')); return; }
  await new Promise(r => setTimeout(r, 3500));
  for (let i = 0; i < 60; i++) {
    try { const c = await api('/api/config'); if (c.config) { location.reload(); return; } } catch (e) {}
    await new Promise(r => setTimeout(r, 1000));
  }
  $('#ovt').textContent = T('Keine Verbindung'); $('#ovs').textContent = T('Starte die App über das Startmenü oder den Autostart neu.');
}
$('#save').onclick = () => apply(T('Wird angewendet …'), () => api('/api/config', {config: cfg}));
$('#discard').onclick = () => { cfg = JSON.parse(JSON.stringify(saved)); applyTheme(); setLang(cfg.ui.language); render(); touch(); };
window.addEventListener('beforeunload', e => { if (dirty()) { e.preventDefault(); e.returnValue = ''; } });

api('/api/config').then(r => {
  cfg = r.config; saved = JSON.parse(JSON.stringify(cfg)); meta = r; applyTheme(); tab = r.first_run ? 'start' : 'overview';
  setLang(new URLSearchParams(location.search).get('lang') || cfg.ui.language);
  render();
}).catch(() => { $('#main').textContent = T('Keine Verbindung zur App.'); });
</script>
</body>
</html>

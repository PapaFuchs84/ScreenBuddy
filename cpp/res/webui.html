aside{--text:#14213d;--bg:#fff4e6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h3,.brand,nav button,.btn,.val,.page .n{font-family:var(--head)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--orange);padding:20px 14px;position:sticky;top:0;height:100vh;
display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:700;font-size:19px;color:var(--text)}
.brand svg{width:34px;height:34px;flex:none}
.brand small{display:block;font-weight:400;color:var(--text);opacity:.8;font-size:12px;font-family:"Segoe UI",system-ui,sans-serif}
nav button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:0;
background:none;padding:10px 12px;border-radius:10px;color:var(--text);cursor:pointer;font-weight:600;font-size:15px}
nav button:hover{background:#ffffff33}
nav button.on{background:var(--bg);color:var(--text);box-shadow:0 2px 0 #b0520040}
nav .dot{width:9px;height:9px;border-radius:50%;border:2px solid #14213d66}
nav .dot.act{background:var(--text);border-color:var(--text)}
.foot{margin-top:auto;color:var(--text);font-size:12px;padding:8px}
main{padding:28px 34px 110px;max-width:980px}
h1{margin:0 0 4px;font-size:28px;font-weight:600}
.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;
box-shadow:0 1px 2px #b0520014}
.card h3{margin:0 0 4px;font-size:17px;font-weight:600}
.card p.hint{margin:0 0 14px;color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .lbl b{display:block;font-weight:600}
.row .lbl span{color:var(--muted);font-size:13px}
input[type=text],input[type=password],input[type=number],select,textarea{background:var(--field);border:1px solid var(--line);
border-radius:10px;padding:9px 12px;min-width:230px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #f77f0033}
textarea{width:100%;min-height:64px;resize:vertical}
input[type=range]{accent-color:var(--orange);width:230px}
.val{min-width:64px;text-align:right;color:var(--accent);font-weight:700}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;cursor:pointer;margin:0;z-index:1}
.sw i{position:absolute;inset:0;background:#e2cdb3;border-radius:26px;transition:.15s}
.sw i:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px #0003}
.sw input:checked+i{background:var(--orange)}
.sw input:checked+i:before{transform:translateX(20px)}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--text)}
.btn:hover{border-color:var(--orange)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.btn.pri:hover{border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-weight:600;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.preview{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start}
.preview img{width:480px;max-width:100%;border-radius:12px;border:6px solid #14213d;background:#14213d;display:block}
.preview-screen{min-width:0;max-width:480px}
.preview-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.preview-status{color:var(--muted);font-size:13px;margin:8px 0}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:6px 0 12px}
.colors label{display:flex;align-items:center;gap:10px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:600}
.colors label small{display:block;font-weight:400;color:var(--muted);font-family:Consolas,monospace;font-size:12px}
input[type=color]{width:40px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--field);cursor:pointer;flex:none}
.warn{color:var(--yellow);font-weight:600}
.pagelist{display:flex;flex-direction:column;gap:8px}
.page{display:flex;align-items:center;gap:12px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.page .n{width:24px;height:24px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink)}
.page .t{flex:1}.page .t b{display:block}.page .t span{font-size:12px;color:var(--muted)}
.page.off{opacity:.5}
.arrows{display:flex;flex-direction:column;gap:2px}
.arrows button{border:0;background:var(--card2);color:var(--text);border-radius:6px;width:26px;height:18px;line-height:1;cursor:pointer;font-size:11px}
.arrows button:disabled{opacity:.25;cursor:default}
.list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.item{display:flex;align-items:center;gap:12px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.item .t{flex:1;min-width:0}.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:12.5px;color:var(--muted)}
.item .ok{color:var(--green)}.item .bad{color:var(--red)}
.add{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.add input{flex:1;min-width:200px}
.members{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--field);margin-top:10px}
.member{display:flex;align-items:center;gap:12px;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer}
.member:first-child{border-top:0}.member:hover{background:var(--bg)}
.member input{accent-color:var(--orange);width:17px;height:17px}
.member small{color:var(--muted);margin-left:auto}
.ok{color:var(--green)}.bad{color:var(--red)}
.conn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);margin:0 0 12px;font-weight:600}
.conn .d{width:10px;height:10px;border-radius:50%;background:#c9b49a;flex:none}.conn .t{flex:1;min-width:0}
.conn-ok{background:var(--okbg);border-color:var(--okline)}.conn-ok .d{background:var(--green)}.conn-ok .t{color:var(--green)}
.conn-bad{background:var(--badbg);border-color:var(--badline)}.conn-bad .d{background:var(--red)}.conn-bad .t{color:var(--red)}
.conn-off .t{color:var(--muted);font-weight:400}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;background:var(--card2);color:var(--muted)}
.chip.warn{background:#fde9bf;color:var(--yellow)}.chip.good{background:var(--orange);color:var(--ink);font-weight:700}
.note{color:var(--muted);font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-weight:600;padding:6px 0}
.howto{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin-top:12px}
.howto summary{color:var(--accent)}.howto ol{margin:6px 0 10px;padding-left:22px}.howto li{margin:5px 0}
.howto .links{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
a.btn{text-decoration:none;display:inline-block;color:var(--text)}a.btn.pri{color:var(--ink)}.foot a{color:var(--text);font-weight:600}
.bar{position:fixed;left:230px;right:0;bottom:0;background:var(--card);border-top:2px solid var(--orange);padding:14px 34px;
display:flex;align-items:center;gap:14px;transform:translateY(100%);transition:.2s;backdrop-filter:blur(6px)}
.bar.show{transform:none}.bar span{flex:1;color:var(--accent);font-weight:600}
.overlay{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;text-align:center;z-index:9}
.overlay.show{display:grid}.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--orange);
border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;top:18px;right:22px;background:var(--red);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:10}
@media(max-width:1150px){.preview{grid-template-columns:1fr}}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}
.foot,.brand small{display:none}.bar{left:0}.preview{grid-template-columns:1fr}main{padding:20px 16px 110px}}

function checkList(sec, key, kind, placeholder) {
  const list = h('div', {class: 'list'});
  const info = {};
  const draw = () => list.replaceChildren(...cfg[sec][key].map((v, i) => {
    const r = info[v], st = r ? (r.ok ? h('span', {class: 'ok'}, kind === 'bf6'
      ? `${L === 'en' ? 'Rank' : 'Rang'} ${r.rank ?? '?'}${r.rank_name ? ' · ' + r.rank_name : ''} · K/D ${r.kd ?? '–'}` + (r.id ? ` · ID ${r.id}` : '') : `${r.source}: ${r.latest}`)
      : h('span', {class: 'bad'}, r.error)) : h('span', {}, 'Noch nicht geprüft');
    // BF6: gefundene Spieler-ID als "Name#ID" in den Eintrag übernehmen (Abfrage per ID bleibt stabil, auch bei Namenswechsel)
    const take = kind === 'bf6' && r && r.ok && r.id && !/#\d{6,}$/.test(v)
      ? h('button', {class: 'btn sm', onclick: () => { const nv = v + '#' + r.id; cfg[sec][key][i] = nv; info[nv] = r; touch(); draw(); }}, 'ID übernehmen') : null;
    return h('div', {class: 'item'}, h('div', {class: 't'}, h('b', {}, v), st), take,
      h('button', {class: 'btn sm', onclick: async e => { e.target.disabled = true; e.target.textContent = '…';
        info[v] = await api(`/api/check/${kind}?${kind === 'bf6' ? 'name' : 'url'}=${encodeURIComponent(v)}`); draw(); }}, 'Prüfen'),
      h('button', {class: 'btn sm', onclick: () => { cfg[sec][key].splice(i, 1); touch(); draw(); renderNav(); }}, 'Entfernen')); }));
  draw();
  const inp = h('input', {type: 'text', placeholder});
  let plat = null;
  if (kind === 'bf6') plat = h('select', {style: 'min-width:130px'}, [['', 'PC (EA)'], ['@psn', 'PlayStation'], ['@xbox', 'Xbox']].map(([v, l]) => h('option', {value: v}, l)));
  const idInp = kind === 'bf6' ? h('input', {type: 'text', inputmode: 'numeric', placeholder: T('Spieler-ID (optional)'), style: 'max-width:170px'}) : null;
  const add = () => { let v = inp.value.trim(); if (!v) return; if (plat) v += plat.value;
    if (idInp && idInp.value.trim()) { const id = idInp.value.replace(/\D/g, ''); if (id.length < 6) return toast(T('Die Spieler-ID besteht aus mindestens 6 Ziffern.')); v += '#' + id; idInp.value = ''; }
    if (!cfg[sec][key].includes(v)) cfg[sec][key].push(v); inp.value = ''; touch(); draw(); renderNav(); };
  inp.addEventListener('keydown', e => e.key === 'Enter' && add());
  return h('div', {}, list, h('div', {class: 'add'}, inp, plat, idInp, h('button', {class: 'btn', onclick: add}, 'Hinzufügen')));
}
/* ---------- Dauerhafter Verbindungsstatus (Discord, Steam, Xbox) ---------- */
let connTimer = null;
function ago(ts) {
  const m = Math.floor((Date.now() / 1000 - ts) / 60);
  if (L === 'en') return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ago`;
  return m < 1 ? 'gerade eben' : m < 60 ? `vor ${m} min` : `vor ${Math.floor(m / 60)} h`;
}
function connLine(p, c) {
  if (!c || c.state === 'off') return ['off', T('Noch nicht eingerichtet')];
  if (c.state === 'idle' && p === 'homeassistant') return ['off', T('Zugang gespeichert – er wird genutzt, sobald die Seite an und alles ausgefüllt ist')];
  if (c.state === 'idle') return ['off', T(p === 'discord'
    ? 'Verbinde … oder Token gespeichert, aber gerade nicht genutzt'
    : 'Zugang gespeichert – er wird genutzt, sobald die Seite „Freunde“ an und alles ausgefüllt ist')];
  const en = L === 'en';
  if (c.state === 'ok') return ['ok', `${en ? 'Connected' : 'Verbunden'}${c.name ? (en ? ' as ' : ' als ') + c.name : ''} · ${c.detail}`
    + (c.live ? ' · live' : c.at ? (en ? ' · last checked ' : ' · zuletzt abgefragt ') + ago(c.at) : '')];
  return ['bad', (c.error || T('Fehler')) + (c.at ? (en ? ` (last success ${ago(c.at)})` : ` (letzter Erfolg ${ago(c.at)})`) : '')];
}
function connBadge(p) {
  return h('div', {class: 'conn conn-off', 'data-p': p}, h('i', {class: 'd'}), h('span', {class: 't'}, 'Status wird geladen …'));
}
async function updateConn() {
  let data; try { data = await api('/api/connections'); } catch (e) { return; }

}

function linksEditor() {
  const box = h('div'); let accounts = [], suggestions = [];
  const NAMES = {discord: 'Discord', steam: 'Steam', xbox: 'Xbox', psn: 'PlayStation'};
  const parse = e => { const [name, ...members] = e.split('|'); return {name, members}; };
  const draw = () => {
    const rows = cfg.friends.links.map((e, i) => { const l = parse(e);
      return h('div', {class: 'item'}, h('div', {class: 't'}, h('b', {}, l.name),
        h('span', {}, l.members.map(m => NAMES[m.split(':')[0]] || m.split(':')[0]).join(' + '))),
        h('button', {class: 'btn sm', onclick: () => { cfg.friends.links.splice(i, 1); touch(); draw(); }}, 'Entfernen')); });
    const opt = a => h('option', {value: a.platform + ':' + a.id}, `${a.name} (${NAMES[a.platform]})`);
    const A = h('select', {}, accounts.map(opt)), B = h('select', {}, accounts.map(opt));
    const link = (a, b) => {   // a, b: Konten {platform, id, name}; erweitert eine vorhandene Verknüpfung, sonst neu
      const av = a.platform + ':' + a.id, bv = b.platform + ':' + b.id;
      const L = cfg.friends.links, at = L.findIndex(e => parse(e).members.some(m => m === av || m === bv));
      if (at >= 0) { const l = parse(L[at]); for (const v of [av, bv]) if (!l.members.includes(v)) l.members.push(v);
        L[at] = [l.name, ...l.members].join('|'); }
      else L.push([a.name, av, bv].join('|'));
      suggestions = suggestions.filter(s => s.a !== a || s.b !== b);
      touch(); draw(); };
    const add = () => {
      const find = v => accounts.find(x => x.platform + ':' + x.id === v);
      if (A.value && B.value && A.value !== B.value) link(find(A.value), find(B.value)); };
    const sug = suggestions.map(s => h('div', {class: 'item'}, h('div', {class: 't'},
      h('b', {}, `${s.a.name} (${NAMES[s.a.platform]}) = ${s.b.name} (${NAMES[s.b.platform]})?`),
      h('span', {}, 'Ähnliche Namen – dieselbe Person?')),
      h('button', {class: 'btn sm', onclick: () => link(s.a, s.b)}, 'Ja, zusammenführen'),
      h('button', {class: 'btn sm', onclick: () => { suggestions = suggestions.filter(x => x !== s); draw(); }}, 'Nein')));
    box.replaceChildren(...(sug.length ? [h('div', {class: 'list', style: 'margin-bottom:14px'}, sug)] : []), h('div', {class: 'list'}, rows),
      accounts.length ? h('div', {class: 'add'}, A, B, h('button', {class: 'btn', onclick: add}, 'Verknüpfen'))
        : h('p', {class: 'note'}, 'Sobald Konten verbunden sind, kannst du sie hier zusammenführen.')); };
  api('/api/friends/accounts').then(r => { accounts = r.accounts; suggestions = r.suggestions || []; draw(); }); draw();
  return box;
}

  const c = cfg.homeassistant, box = h('div'), pick = h('div');

    renderNav();

  const add = (id, label) => {
    id = id.trim().toLowerCase();
    if (!/^[a-z_]+\.[a-z0-9_]+$/.test(id)) return toast(T('Das ist keine gültige Entität (so sieht eine aus: sensor.wohnzimmer_temperatur)'));

    pick.replaceChildren(h('p', {class: 'hint'}, loaded.touch ? 'Sensoren und Schalter aus deiner Installation' : 'Sensoren aus deiner Installation (Schalter erscheinen hier, sobald Touch aktiv ist)'), q, res);
  };
  const out = h('span', {class: 'note'});

      out.className = r.ok ? 'ok' : 'bad';
      out.textContent = r.ok ? (L === 'en' ? `Connected: ${r.entities.length} entities found` : `Verbunden: ${r.entities.length} Entitäten gefunden`) : r.error;
      loaded = r.ok ? r : null; drawPick();

    check.disabled = false; }}, 'Verbindung prüfen & Entitäten laden');
  const idIn = h('input', {type: 'text', placeholder: 'sensor.wohnzimmer_temperatur'}), lbIn = h('input', {type: 'text', placeholder: 'Anzeigename (optional)', style: 'max-width:200px'});
  const addIn = () => { add(idIn.value, lbIn.value); idIn.value = ''; lbIn.value = ''; };
  idIn.addEventListener('keydown', e => e.key === 'Enter' && addIn());
  drawList();
  const ok = haTouchOk();
  return [...head('Home Assistant', 'Bis zu 4 Werte aus deinem Smart Home auf dem Display: Sensoren zeigen den Wert, Schalter lassen sich per Touch umlegen.'),
    card('Seite', null, row('Seite anzeigen', null, toggle('homeassistant', 'enabled')),
      row('Titel', 'Überschrift auf dem Display', text('homeassistant', 'title', 'Home Assistant'))),
    card('Verbindung', 'Die Werte werden alle 15 Sekunden abgefragt, Schalter reagieren sofort.', connBadge('homeassistant'),
      row('Adresse', 'So wie im Browser, z. B. http://homeassistant.local:8123', text('homeassistant', 'url', 'http://homeassistant.local:8123')),
      row('Zugriffstoken', c.token_set ? 'Gespeichert. Leer lassen, um ihn zu behalten.' : 'Wird gleich erklärt',
        text('homeassistant', 'token', c.token_set ? '••••••••••••' : 'Token einfügen', 'password')),
      h('div', {style: 'display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap'}, check, out),
      howto('So bekommst du das Zugriffstoken', [
        ['Öffne Home Assistant im Browser und klicke links unten auf deinen ', B('Namen'), ' (Profil).'],
        ['Oben zu ', B('Sicherheit'), ' wechseln. Ganz unten bei ', B('Langlebige Zugriffstoken'), ' den Knopf ', B('Token erstellen'), ' klicken.'],
        ['Einen Namen eingeben (z. B. „Display“), ', B('OK'), ' klicken und das Token sofort kopieren – es wird nur einmal angezeigt.'],
        ['Hier bei ', B('Zugriffstoken'), ' einfügen. Die App speichert es verschlüsselt, nur dein Windows-Konto kann es lesen.']]),
      h('p', {class: 'note'}, 'Tipp: Die Adresse mit „http://“ bleibt in deinem Heimnetz. Von unterwegs nutzt du die App nicht – das Display steht ja zu Hause.')),
    card('Entitäten', ok ? 'Sensoren zeigen den Wert mit Einheit. Schalter (Schalter, Licht, Ventilator, Eingabe-Schalter) legst du per Tipp auf das Display um.'
        : 'Hier werden nur Sensoren gezeigt. Schalter lassen sich nur wählen, wenn ein Touch-Bildschirm angeschlossen und Touch eingeschaltet ist (Reiter Display).',

/* ---------- Design (hell/dunkel/eigene Farben) ---------- */
const COLORS = [['bg', 'Hintergrund'], ['card', 'Karten'], ['header', 'Kopfzeile & Balken'], ['accent', 'Akzentschrift'],
  ['text', 'Schrift'], ['muted', 'Nebentext']];
/* Die Einstellungsseite folgt der Vorlage (hell/dunkel); die eigenen Farben gelten nur fürs Display */
const baseTheme = () => cfg.display.theme === 'eigen' ? cfg.display.color_base : cfg.display.theme;
const applyTheme = () => { const t = baseTheme() === 'dunkel' ? 'dunkel' : baseTheme() === 'vice-sunset' ? 'vice' : 'hell';
  document.documentElement.dataset.theme = t; try { localStorage.setItem('fl_theme', t); } catch (e) {} };
/* Sprache sofort in der Seite umschalten; Display und Infobereich folgen nach „Speichern & anwenden“ */
function langSel() { const s = select('ui', 'language', [['de', 'Deutsch'], ['en', 'English']]);
  s.addEventListener('change', () => { setLang(cfg.ui.language); render(); }); return s; }
function themeSel() { const s = select('display', 'theme', [['hell', 'Hell (Creme)'], ['dunkel', 'Dunkel (Navy)'], ['vice-sunset', 'Vice Sunset (Retro-Dämmerung)'], ['eigen', 'Eigene Farben']]);
  s.addEventListener('change', () => { applyTheme(); render(); }); return s; }
/* Kontrast nach WCAG, wie auf dem Display gerechnet (render.contrast) */
function contrast(a, b) {
  const lum = x => { const v = [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16) / 255)
    .map(c => c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; };
  const [hi, lo] = [lum(a), lum(b)].sort((x, y) => y - x); return (hi + 0.05) / (lo + 0.05);
}
function colorCard() {
  const d = cfg.display, presets = (cache.opts || {}).presets || {};
  const val = k => d['color_' + k] || (presets[d.color_base] || {})[k] || '#000000';
  const img = h('img', {alt: 'Vorschau mit deinen Farben'}), warn = h('p', {class: 'note'});
  let timer = null;
  const refresh = () => {
    const c = Object.fromEntries(COLORS.map(([k]) => [k, val(k)])), w = [];
    if (contrast(c.text, c.bg) < 4.5) w.push(T('Schrift auf Hintergrund'));
    if (contrast(c.text, c.card) < 4.5) w.push(T('Schrift auf Karten'));
    if (contrast(c.muted, c.bg) < 3) w.push(T('Nebentext auf Hintergrund'));
    if (contrast(c.accent, c.bg) < 3) w.push(T('Akzentschrift auf Hintergrund'));
    warn.className = w.length ? 'warn' : 'note';
    warn.textContent = L === 'en'
      ? (w.length ? 'Hard to read: ' + w.join(', ') + '. Choose more difference between light and dark there.'
        : 'Everything is easy to read. The app picks the header text colour itself (navy or white).')
      : w.length ? 'Schwer lesbar: ' + w.join(', ') + '. Wähle dort mehr Unterschied zwischen hell und dunkel.'
      : 'Alles gut lesbar. Die Schrift auf der Kopfzeile wählt die App selbst (Navy oder Weiß).';
    clearTimeout(timer); timer = setTimeout(async () => {
      const body = {display: {theme: 'eigen', color_base: d.color_base, ...Object.fromEntries(COLORS.map(([k]) => ['color_' + k, d['color_' + k]]))}};
      try {
        const r = await fetch('/api/preview-theme.png', {method: 'POST', headers: {'X-FL': '1', 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
        if (r.ok) { const old = img.src; img.src = URL.createObjectURL(await r.blob()); if (old) URL.revokeObjectURL(old); }
      } catch (e) {} }, 250);
  };
  const pickers = COLORS.map(([k, label]) => {
    const i = h('input', {type: 'color', value: val(k)}), code = h('small', {}, val(k).toUpperCase());
    i.addEventListener('input', () => { d['color_' + k] = i.value.toUpperCase(); code.textContent = d['color_' + k]; touch(); refresh(); });
    return h('label', {}, i, h('span', {}, label, code)); });
  const base = select('display', 'color_base', [['hell', 'Hell (Creme)'], ['dunkel', 'Dunkel (Navy)']]);
  base.addEventListener('change', () => { applyTheme(); render(); });
  const reset = h('button', {class: 'btn', onclick: () => { COLORS.forEach(([k]) => d['color_' + k] = ''); touch(); render(); }}, 'Zurücksetzen');
  refresh();
  return card('Eigene Farben', 'Gilt für das Display. Die Vorschau zeigt die aktuelle Seite mit deinen Farben, übernommen wird erst mit „Speichern & anwenden“.',
    h('div', {class: 'preview'}, img, h('div', {},
      row('Ausgangsfarben', 'Leere Farben kommen von dieser Vorlage', base),
      h('div', {class: 'colors'}, pickers), warn,
      h('div', {style: 'display:flex;gap:8px;align-items:center'}, reset, h('span', {class: 'note'}, 'Setzt alle Farben auf die Vorlage zurück.')))));
}

let companionTimer = null, pairTimer = null;

    let s;

    if (s.locked_for > 0) list.append(item('Kopplung gesperrt (zu viele Fehlversuche)', 'bad', `${Math.ceil(s.locked_for / 60)} min`));

    if (pairTimer && !(s.pairing || {}).active) { stopPair(); pairBox.replaceChildren(h('p', {class: 'note'}, 'Code verwendet oder abgelaufen.')); }
    const online = new Set(s.clients.map(x => x.id));
    devBox.replaceChildren(s.devices.length ? h('div', {class: 'list'}, s.devices.map(d => item(d.name,
      online.has(d.id) ? 'ok' : '', `${T('Gekoppelt am')} ${when(d.added)} · ${online.has(d.id) ? T('verbunden') : T('zuletzt') + ' ' + when(d.last_seen)}`,
      h('button', {class: 'btn sm', onclick: async () => {
        if (!confirm(T('Kopplung entfernen? Das Gerät muss danach neu gekoppelt werden.'))) return;
        const r = await api('/api/companion/devices/remove', {id: d.id}); if (!r.ok) toast(r.error || T('Fehler')); refresh(); }}, 'Entfernen'))))
      : h('p', {class: 'note'}, 'Noch kein Gerät gekoppelt.'));
  };
  const stopPair = () => { clearInterval(pairTimer); pairTimer = null; };
  const showPair = r => {
    stopPair();
    const left = h('b', {}), until = Date.now() + r.expires_in * 1000;
    const tick = () => {
      const sec = Math.max(0, Math.round((until - Date.now()) / 1000));
      left.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
      if (!sec) { stopPair(); pairBox.replaceChildren(h('p', {class: 'note'}, 'Code abgelaufen. Bei Bedarf einen neuen anzeigen.')); }
    };
    pairBox.replaceChildren(h('div', {style: 'display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-top:12px'},
      h('img', {src: r.qr, alt: 'QR-Code zum Koppeln', width: 220, height: 220,
        style: 'width:220px;height:220px;image-rendering:pixelated;background:#fff;padding:8px;border-radius:8px'}),
      h('div', {},
        h('div', {style: 'font-size:34px;font-weight:700;letter-spacing:6px;font-family:monospace'}, r.pin.slice(0, 3) + ' ' + r.pin.slice(3)),
        h('p', {class: 'note'}, `${r.host}:${r.port} · `, left),
        h('p', {class: 'hint'}, 'Ohne Kamera: in der App Adresse und PIN eintippen und den Fingerabdruck vergleichen.'),
        h('p', {style: 'font-family:monospace;word-break:break-all;font-size:12px'}, r.fingerprint),
        h('button', {class: 'btn sm', onclick: async () => { stopPair(); await api('/api/companion/pair/cancel', {}); pairBox.replaceChildren(); }}, 'Abbrechen'))));
    tick(); pairTimer = setInterval(tick, 1000);
  };
  const pairBtn = h('button', {class: 'btn pri', disabled: !savedOn, onclick: async () => {
    pairBtn.disabled = true;
    try { const r = await api('/api/companion/pair', {}); if (r.ok) { showPair(r); refresh(); } else toast(r.error || T('Fehler')); }
    catch (e) { toast(T('Fehler')); }
    pairBtn.disabled = false; }}, 'Kopplungscode anzeigen');
  const tg = toggle('companion', 'enabled');
  if (forced) tg.querySelector('input').disabled = true;
  tg.addEventListener('change', () => render());
  const nav = h('div', {style: 'display:flex;gap:10px;margin-top:12px'});
  for (const [delta, label] of [[-1, L === 'en' ? 'Previous page' : 'Vorige Seite'], [1, L === 'en' ? 'Next page' : 'Nächste Seite']])
    nav.append(h('button', {class: 'btn', disabled: !savedOn, onclick: async () => {
      const r = await api('/api/companion/pages/step', {delta}); if (!r.ok) toast(r.error || T('Fehler'));
    }}, label));
  refresh(); companionTimer = setInterval(() => document.hidden || tab !== 'companion' || refresh(), 4000);
  return [...head('Companion', 'Ein Android-Handy oder -Tablet im selben WLAN zeigt das Display und reagiert auf Tippen.'),
    card('Companion-App (Android)', null,
      row('Companion einschalten', forced ? 'Die Companion-App ist der Display-Typ und läuft deshalb immer.'
        : 'Startet einen verschlüsselten Dienst nur im Heimnetz (nie aus dem Internet erreichbar). Standard: aus.', tg),
      row('Port', 'Standard 8777. Nicht 8765 (Einstellungsseite).', text('companion', 'port', '8777')),
      h('p', {class: 'note'}, 'Windows fragt beim ersten Start eventuell nach der Firewall: „Private Netzwerke“ erlauben.')),
    companionOn() ? card(L === 'en' ? 'Independent Companion display' : 'Unabhängige Companion-Anzeige',
      L === 'en' ? 'Swipe, taps and page timer affect only Companion. All paired phones share this view. Enable and configure the data sources in their tabs.'
        : 'Wischen, Tippen und Wechselrhythmus wirken nur auf Companion. Alle gekoppelten Handys teilen diese Ansicht. Datenquellen in ihren Reitern einschalten und einrichten.',
      outputPagePicker('companion', 'pages'),
      row('Anzeigedauer pro Seite', null, range('companion', 'page_seconds', 3, 600, 1, '% s')), nav,
      h('p', {class: 'note'}, L === 'en' ? 'Resolution is reported by the phone, including after rotation. The first connected phone determines it; other phones use letterboxing.'
        : 'Das Handy meldet seine Auflösung auch nach dem Drehen. Das zuerst verbundene Handy bestimmt sie; weitere Handys nutzen eine Anzeige mit passendem Seitenverhältnis.')) : null,
    card('Zustand', null, box),
    card('Gerät koppeln', 'In der App „Koppeln“ wählen und den QR-Code scannen. Der Code gilt 2 Minuten und nur einmal; nach 5 falschen Versuchen ist das Koppeln 5 Minuten gesperrt.',
      savedOn ? pairBtn : h('p', {class: 'note'}, 'Erst Companion einschalten und speichern.'), pairBox),
    card('Gekoppelte Geräte', null, devBox)];
}

const VIEWS = {homeassistant: viewHa, companion: viewCompanion, start: viewStart, overview: viewOverview, friends: viewFriends, discord: viewDiscord, bf6: viewBf6, rss: viewRss, system: viewSystem, display: viewDisplay};
function render() {
  clearInterval(previewTimer); clearInterval(statusTimer); clearInterval(connTimer); clearInterval(companionTimer); clearInterval(pairTimer);
  $('#main').replaceChildren(...VIEWS[tab]().filter(Boolean));
  renderNav();
  $('#foot').replaceChildren(h('a', {href: '/anleitung?lang=' + L, target: '_blank'}, '📖 Bebilderte Anleitung'), h('br'),
    h('a', {href: 'https://www.paypal.me/SHerbst84', target: '_blank', rel: 'noopener noreferrer'}, '☕ Spendier mir einen Kaffee'), h('br'),
    'Version ' + meta.version + ' · © 2026 FuchsLabs');
  if (document.querySelector('.conn')) { updateConn(); connTimer = setInterval(() => document.hidden || updateConn(), 5000); }
  if (tab === 'overview') { refreshOverviewPreview(); previewTimer = setInterval(refreshOverviewPreview, 1000); }
}

async function apply(title, fn) {
  $('#ovt').textContent = title || T('Wird angewendet …');
  $('#ovs').textContent = T('Die Anzeige startet neu, das dauert etwa 10 Sekunden.');
  $('#overlay').classList.add('show');
  const r = await fn();
  if (r && r.ok === false) { $('#overlay').classList.remove('show'); toast(r.error || T('Fehler')); return; }
  await new Promise(r => setTimeout(r, 3500));
  for (let i = 0; i < 60; i++) {
    try { const c = await api('/api/config'); if (c.config) { location.reload(); return; } } catch (e) {}
    await new Promise(r => setTimeout(r, 1000));
  }
  $('#ovt').textContent = T('Keine Verbindung'); $('#ovs').textContent = T('Starte die App über das Startmenü oder den Autostart neu.');
}
$('#save').onclick = () => apply(T('Wird angewendet …'), () => api('/api/config', {config: cfg}));
$('#discard').onclick = () => { cfg = JSON.parse(JSON.stringify(saved)); applyTheme(); setLang(cfg.ui.language); render(); touch(); };
window.addEventListener('beforeunload', e => { if (dirty()) { e.preventDefault(); e.returnValue = ''; } });

api('/api/config').then(r => {
  cfg = r.config; saved = JSON.parse(JSON.stringify(cfg)); meta = r; applyTheme(); tab = r.first_run ? 'start' : 'overview';
  setLang(new URLSearchParams(location.search).get('lang') || cfg.ui.language);
  render();
}).catch(() => { $('#main').textContent = T('Keine Verbindung zur App.'); });
</script>
</body>

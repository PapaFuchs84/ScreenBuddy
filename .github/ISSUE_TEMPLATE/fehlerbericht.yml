name: Fehlerbericht
description: Etwas funktioniert nicht wie erwartet
title: "[Fehler] "
labels: ["fehler", "testphase"]
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden! Bitte **niemals** `config.toml`, Bot-Token oder Steam-/Xbox-Schlüssel anhängen.
        Wo das Protokoll liegt, steht in `TESTPHASE.md`.
  - type: input
    id: version
    attributes:
      label: Version
      description: Steht links unten in der Einstellungsseite
      placeholder: "1.1"
    validations:
      required: true
  - type: dropdown
    id: bereich
    attributes:
      label: Wo tritt der Fehler auf?
      multiple: true
      options:
        - Display (Bild, Helligkeit, Ausrichtung)
        - Seite System
        - Seite Freunde / Discord
        - Seite Battlefield 6
        - Seite Blogs
        - Einstellungsseite
        - Anleitung
        - Start, Autostart, Infobereich
        - Sonstiges
    validations:
      required: true
  - type: textarea
    id: was
    attributes:
      label: Was hast du gemacht, und was ist passiert?
      placeholder: "1. Einstellungsseite geöffnet\n2. Bei Steam auf „Verbindung prüfen“ geklickt\n3. Es erscheint …"
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Was hättest du erwartet?
  - type: textarea
    id: log
    attributes:
      label: Auszug aus usb-display.log
      description: Die letzten Zeilen rund um den Fehler. Namen, die du nicht teilen willst, vorher ersetzen.
      render: text
  - type: textarea
    id: bilder
    attributes:
      label: Fotos oder Screenshots
      description: Ein Foto vom Display oder ein Screenshot hilft sehr (per Drag & Drop einfügen).
  - type: input
    id: system
    attributes:
      label: Windows-Version und Display-Anschluss
      placeholder: "Windows 11, USB direkt am PC"

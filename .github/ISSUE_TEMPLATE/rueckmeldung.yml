name: Idee oder Rückmeldung
description: Was gefällt dir, was fehlt, was ist umständlich?
title: "[Idee] "
labels: ["rueckmeldung", "testphase"]
body:
  - type: textarea
    id: rueckmeldung
    attributes:
      label: Deine Rückmeldung
      placeholder: "Ich fände es gut, wenn …"
    validations:
      required: true
  - type: dropdown
    id: einrichtung
    attributes:
      label: Wie leicht war die Einrichtung?
      options:
        - Sehr leicht
        - Ging so
        - Schwierig
        - Habe ich nicht geschafft
  - type: textarea
    id: hakte
    attributes:
      label: Wo hat es gehakt?
      description: Zum Beispiel ein Schritt in der Anleitung, der unklar war.

# © 2026 FuchsLabs – Plugin-Parser, Beispiel-Plugins und Validator (Linux, ohne Netzwerkzugriff der Plugins)
name: Plugin validator

on:
  push:
    branches: [ "main" ]
    paths: [ "cpp/src/plugin*", "cpp/tools/plugin_*.cpp", "cpp/examples/plugins/**", "cpp/tests/plugin*", "cpp/tests/build-validator-linux.sh", ".github/workflows/plugin-validator.yml" ]
  pull_request:
    paths: [ "cpp/src/plugin*", "cpp/tools/plugin_*.cpp", "cpp/examples/plugins/**", "cpp/tests/plugin*", "cpp/tests/build-validator-linux.sh", ".github/workflows/plugin-validator.yml" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nlohmann/json
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev libssl-dev
      - name: Build and run plugin tests and validator
        run: sh cpp/tests/build-validator-linux.sh

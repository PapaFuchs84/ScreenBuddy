{t: 'Companion: independent phone display', html: () => `<p class="kicker">Optional · Companion</p><h1>USB display and phone at the same time</h1><p class="lead">Companion: both outputs have their own pages and timers.</p><ol class="do"><li>Keep the USB/HDMI display type. Open <b>App › Companion</b>, enable Companion, then save and apply.</li><li>Install the Companion app (separate download; on Android TV it appears in the TV launcher, and left/right on the remote switches the page). An older debug APK uses a different certificate and cannot be directly updated; agree on backup and migration before uninstalling it. A fresh installation needs pairing again. Use the same private network or USB tethering. Pair with the local code and compare the certificate fingerprint.</li><li>Choose pages and timing for the phone under <b>App › Companion</b>. Choose the other output under <b>View › Pages &amp; order</b>.</li><li>The extra controls appear only while Companion is enabled. Enable and configure each data source on its own tab under <b>Pages</b>.</li><li>Screen edges cut off on a TV? Set the keepout zone for each device here (see “Safe margins”).</li></ol>${shot('s_app', [], 'App › Companion with pairing and the paired devices.')}<p>Swiping changes only the phone view. Native resolution follows connection and rotation. The first connected phone determines the shared Companion size; other phones share its pages. Larger requests are reduced proportionally to 2560 pixels per edge / 4,194,304 pixels. Real Redmi output, injected gestures and reconnect were tested over USB tethering with the predecessor 0.2.1-preview. The user also confirmed sharp output, finger swipes and taps. Wi-Fi and physical USB output in the same new PC instance need separate acceptance.</p>`}
];

const $ = s => document.querySelector(s);
if (location.protocol !== 'file:') $('#lang').href = '/anleitung?lang=de';
const active = () => STEPS.filter(s => !s.need || sel[s.need]);
function show(i) {
  const list = active(); cur = Math.max(0, Math.min(i, list.length - 1)); const s = list[cur];
  seen.add(s.t);
  $('#main').innerHTML = `<section class="step">${s.html()}</section>`;
  s.init && s.init();
  $('#count').innerHTML = `<span>Step </span><b>${cur + 1}</b> of ${list.length}`;
  $('#prog').style.width = ((cur + 1) / list.length * 100) + '%';
  $('#back').disabled = cur === 0;
  $('#next').textContent = cur === list.length - 1 ? 'Start again ↺' : 'Next →';
  document.title = `${s.t} · Set up ScreenBuddy`;
  try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
  window.scrollTo({top: 0});
  $('#main').querySelectorAll('[data-feat]').forEach(el => el.onclick = () => {
    sel[el.dataset.feat] = !sel[el.dataset.feat]; el.classList.toggle('on', sel[el.dataset.feat]); saveSel(); });
  $('#main').querySelectorAll('[data-zoom]').forEach(el => el.onclick = () => {
    $('#zoom').innerHTML = el.outerHTML; $('#zoom').classList.add('show'); });
}
$('#next').onclick = () => show(cur === active().length - 1 ? 0 : cur + 1);
$('#back').onclick = () => show(cur - 1);
$('#zoom').onclick = () => $('#zoom').classList.remove('show');
$('#menu').onclick = () => {
  const list = active();
  $('#toclist').innerHTML = list.map((s, i) => `<li class="${i === cur ? 'cur' : seen.has(s.t) ? 'done' : ''}"><button data-go="${i}"><i>${seen.has(s.t) && i !== cur ? '✓' : i + 1}</i>${s.t}</button></li>`).join('');
  $('#toclist').querySelectorAll('[data-go]').forEach(b => b.onclick = () => { $('#toc').classList.remove('show'); show(+b.dataset.go); });
  $('#toc').classList.add('show');
};
$('#toc').onclick = e => { if (e.target.id === 'toc') $('#toc').classList.remove('show'); };
/* ---------- Search (offline, built lazily on first focus) ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
/* lower-case, strip diacritics; map[k] = index in the original string of normalised char k */
function normMap(text) {
  let n = '', map = [];
  for (let i = 0; i < text.length; i++) {
    const t = text[i].normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/ß/g, 'ss');
    for (let k = 0; k < t.length; k++) { n += t[k]; map.push(i); }
  }
  return {n, map};
}
const normStr = s => normMap(s).n;
let SIDX = null, sHits = [], sAct = -1;
function buildIndex() {
  if (SIDX) return SIDX;
  SIDX = STEPS.map(s => {
    let text = '';
    try {
      const doc = new DOMParser().parseFromString(s.html().replace(/src="data:[^"]*"/g, 'src=""'), 'text/html');
      doc.querySelectorAll('script,style').forEach(el => el.remove());
      text = (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
    } catch (e) {}
    return {s, title: s.t, tn: normMap(s.t), body: text, bn: normMap(text)};
  });
  return SIDX;
}
function markHtml(text, toks) {
  const {n, map} = normMap(text), r = [];
  toks.forEach(t => { for (let p = n.indexOf(t); p >= 0; p = n.indexOf(t, p + t.length)) r.push([map[p], map[p + t.length - 1] + 1]); });
  r.sort((a, b) => a[0] - b[0]);
  let out = '', pos = 0;
  r.forEach(([a, b]) => { if (a < pos) { if (b > pos) { out += '<mark>' + esc(text.slice(pos, b)) + '</mark>'; pos = b; } return; }
    out += esc(text.slice(pos, a)) + '<mark>' + esc(text.slice(a, b)) + '</mark>'; pos = b; });
  return out + esc(text.slice(pos));
}
function runSearch(q) {
  const toks = normStr(q).split(/\s+/).filter(Boolean);
  if (!toks.length) return [];
  const res = [];
  buildIndex().forEach((e, order) => {
    let score = 0, first = -1;
    for (const t of toks) {
      const inT = e.tn.n.indexOf(t), inB = e.bn.n.indexOf(t);
      if (inT < 0 && inB < 0) return;
      if (inT >= 0) score += 20 + (inT === 0 || e.tn.n[inT - 1] === ' ' ? 10 : 0);
      if (inB >= 0) { let c = 0; for (let p = inB; p >= 0 && c < 5; p = e.bn.n.indexOf(t, p + t.length)) c++; score += c; if (first < 0 || inB < first) first = inB; }
    }
    res.push({e, score, first, order});
  });
  return res.sort((a, b) => b.score - a.score || a.order - b.order).slice(0, 8);
}
function snippet(r, toks) {
  const b = r.e.body, from = r.first < 0 ? 0 : r.e.bn.map[r.first] || 0, a = Math.max(0, from - 45);
  let s = b.slice(a, a + 140), start = a;
  if (start > 0) { const sp = s.indexOf(' '); if (sp > -1 && sp < 15) s = s.slice(sp + 1); s = '… ' + s; }
  if (a + 140 < b.length) s += ' …';
  return markHtml(s, toks);
}
function renderResults() {
  const q = $('#q').value, toks = normStr(q).split(/\s+/).filter(Boolean);
  const box = $('#sres'), list = $('#slist'), none = $('#snone');
  if (!toks.length) { closeSearch(); return; }
  sHits = runSearch(q); sAct = sHits.length ? 0 : -1;
  list.innerHTML = sHits.map((r, i) => {
    const hidden = r.e.s.need && !sel[r.e.s.need];
    return `<div role="option" id="sr${i}" data-i="${i}" aria-selected="${i === 0}"><div class="st"><span>${markHtml(r.e.title, toks)}</span>${hidden ? '<small>(not selected)</small>' : ''}</div><div class="sn">${snippet(r, toks)}</div></div>`;
  }).join('');
  none.hidden = sHits.length > 0; box.hidden = false;
  $('#q').setAttribute('aria-expanded', 'true');
  syncAct();
}
function syncAct() {
  $('#slist').querySelectorAll('[role=option]').forEach((el, i) => el.setAttribute('aria-selected', i === sAct));
  if (sAct >= 0) { $('#q').setAttribute('aria-activedescendant', 'sr' + sAct); const el = $('#sr' + sAct); el && el.scrollIntoView({block: 'nearest'}); }
  else $('#q').removeAttribute('aria-activedescendant');
}
function closeSearch() {
  $('#sres').hidden = true; $('#q').setAttribute('aria-expanded', 'false'); $('#q').removeAttribute('aria-activedescendant'); sHits = []; sAct = -1;
}
function gotoHit(i) {
  const r = sHits[i]; if (!r) return;
  const s = r.e.s;
  if (s.need && !sel[s.need]) { sel[s.need] = true; saveSel(); }
  const idx = active().indexOf(s);
  closeSearch(); $('#q').blur();
  show(idx < 0 ? 0 : idx);
}
$('#q').addEventListener('focus', () => { buildIndex(); if ($('#q').value.trim()) renderResults(); });
$('#q').addEventListener('input', renderResults);
$('#q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && sHits.length) { e.preventDefault(); sAct = (sAct + 1) % sHits.length; syncAct(); }
  else if (e.key === 'ArrowUp' && sHits.length) { e.preventDefault(); sAct = (sAct - 1 + sHits.length) % sHits.length; syncAct(); }
  else if (e.key === 'Enter') { e.preventDefault(); gotoHit(sAct); }
  else if (e.key === 'Escape') { e.preventDefault(); if ($('#sres').hidden) $('#q').blur(); else closeSearch(); }
  e.stopPropagation();
});
$('#slist').addEventListener('mousedown', e => e.preventDefault());
$('#slist').addEventListener('click', e => { const o = e.target.closest('[role=option]'); if (o) gotoHit(+o.dataset.i); });
document.addEventListener('click', e => { if (!e.target.closest('.search')) closeSearch(); });

const typing = el => el && (['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName) || el.isContentEditable);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('#zoom').classList.remove('show'); $('#toc').classList.remove('show'); }
  if (((e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) && !typing(document.activeElement)) {
    e.preventDefault(); $('#q').focus(); $('#q').select(); return;
  }
  if (typing(document.activeElement)) return;
  if (document.activeElement.tagName === 'BUTTON' && e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  if (e.key === 'ArrowRight') $('#next').click(); if (e.key === 'ArrowLeft' && cur > 0) show(cur - 1);
});
const fromHash = () => show((parseInt(location.hash.slice(1)) || 1) - 1);
window.addEventListener('hashchange', fromHash);
fromHash();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up ScreenBuddy</title>
<link rel="icon" href="{{img:icon}}">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('fl_theme')||'hell'}catch(e){}</script>
<style>
/* FuchsLabs design: fox orange and cream, navy text. System fonts only. */
:root{--bg:#fff4e6;--card:#fffaf3;--card2:#fae4c8;--line:#eed2b0;--text:#14213d;--muted:#68605c;--orange:#f77f00;
--orange2:#b05200;--green:#168c48;--red:#d72d32;--yellow:#8a5a00;--blue:#5865f2;--head:Bahnschrift,"Segoe UI",system-ui,sans-serif}
html[data-theme=dunkel]{--bg:#0e1628;--card:#14213d;--card2:#1b2b4d;--line:#27395f;--text:#fff4e6;--muted:#a9b4cb;--orange2:#ff9a2e;
--green:#3ccf7a;--red:#ff6266;--yellow:#f0b232}
html[data-theme=dunkel] .box.tip{background:#12392a;border-color:#1f6b46}html[data-theme=dunkel] .box.warn{background:#3d2f0c;border-color:#7a5c14}
html[data-theme=dunkel] .box.secret{background:#3b1518;border-color:#7a2a30}html[data-theme=dunkel] .choice.on{background:#2a2216}
html[data-theme=dunkel] .key{background:var(--card2)}html[data-theme=dunkel] .nav{background:#0e1628f2}
.top,.do li:before,.btnname,.next,.choice.on .tick,.menu{--text:#14213d}.menu{--bg:#fff4e6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:18px/1.55 "Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--orange2)}
b,strong{color:var(--text)}
h1,h2,.brand,.kicker,.big,.choice b{font-family:var(--head)}
.top{position:sticky;top:0;z-index:5;background:var(--orange);box-shadow:0 2px 8px #b0520033}
.topin{max-width:980px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px}
.brand img{width:34px;height:34px}
.count{margin-left:auto;color:var(--text);font-size:15px;white-space:nowrap}
.count b{color:var(--text)}
.menu{background:var(--bg);border:0;border-radius:10px;padding:6px 12px;font-size:15px;font-weight:600}
.prog{height:6px;background:#ffffff55}
.prog i{display:block;height:100%;width:0;background:var(--text);transition:width .3s}
main{max-width:980px;margin:0 auto;padding:26px 20px 130px}
.step{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{color:var(--orange2);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px}
h1{font-size:36px;line-height:1.2;margin:0 0 14px;font-weight:600}
h2{font-size:23px;margin:28px 0 10px;font-weight:600}
p{margin:0 0 14px}
.lead{font-size:21px}
.do{list-style:none;padding:0;margin:18px 0;counter-reset:d;display:flex;flex-direction:column;gap:12px}
.do li{counter-increment:d;position:relative;padding:14px 16px 14px 62px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.do li:before{content:counter(d);position:absolute;left:14px;top:12px;width:34px;height:34px;border-radius:50%;
background:var(--orange);color:var(--text);font-weight:800;display:grid;place-items:center;font-family:var(--head)}
.key{display:inline-block;background:#fff;border:1px solid var(--line);border-bottom-width:3px;border-radius:8px;padding:0 8px;font-weight:700;color:var(--text);white-space:nowrap}
.btnname{display:inline-block;background:var(--orange);color:var(--text);border-radius:8px;padding:0 9px;font-weight:700;white-space:nowrap}
.btnname.grey{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.box{border-radius:14px;padding:14px 16px 14px 56px;margin:16px 0;position:relative;border:1px solid}
.box:before{position:absolute;left:16px;top:12px;font-size:24px;line-height:1}
.box.tip{background:#e4f4ea;border-color:#b5dfc4}.box.tip:before{content:"💡"}
.box.warn{background:#fde9bf;border-color:#efc773}.box.warn:before{content:"⚠️"}
.box.secret{background:#fbe5e5;border-color:#f0babb}.box.secret:before{content:"🔒"}
.box p:last-child{margin:0}
figure{margin:18px 0}
figcaption{color:var(--muted);font-size:15px;margin-top:8px}
.shot{position:relative;display:block;border-radius:12px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in;background:var(--text);box-shadow:0 6px 20px #b0520022}
.shot img{display:block;width:100%;height:auto}
.ring{position:absolute;border:4px solid var(--text);border-radius:12px;box-shadow:0 0 0 4px #f77f0080,0 0 24px #f77f00a0;
animation:pulse 1.6s ease-in-out infinite;pointer-events:none}
.ring b{position:absolute;top:-16px;left:-16px;color:var(--bg);}.ring.tr b{left:auto;right:-16px}.ring b{width:30px;height:30px;border-radius:50%;background:var(--text);color:var(--bg);
display:grid;place-items:center;font-size:16px;box-shadow:0 2px 6px #0006}
@keyframes pulse{50%{box-shadow:0 0 0 9px #f77f0040,0 0 30px #f77f00d0}}
.real{display:inline-block;font-size:13px;background:var(--card2);color:var(--muted);padding:2px 8px;border-radius:20px;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pages{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:18px 0}
.choice{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.choice .ic{font-size:32px;line-height:1}
.choice b{display:block;font-size:19px}
.choice span{color:var(--muted);font-size:15px}
.choice .tick{margin-left:auto;width:30px;height:30px;flex:none;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900}
.choice.on{border-color:var(--orange);background:#ffe9cf}
.choice.on .tick{background:var(--orange);border-color:var(--orange);color:var(--text)}
.choice.on .tick:after{content:"✓"}
.checks{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.help{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.help>summary{list-style:none;padding:14px 18px;font-weight:700;cursor:pointer;color:var(--orange2)}
.help>summary::-webkit-details-marker{display:none}
.help>summary:before{content:"🙋 "}
.help[open]>summary{border-bottom:1px solid var(--line)}
.help .in{padding:14px 18px}
.help dl{margin:0}.help dt{font-weight:700;margin-top:12px;color:var(--text)}.help dt:first-child{margin-top:0}.help dd{margin:2px 0 0}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fffaf3f2;border-top:2px solid var(--orange);backdrop-filter:blur(6px);z-index:5}
.navin{max-width:980px;margin:0 auto;padding:14px 20px;display:flex;gap:12px;align-items:center}
.big{border:0;border-radius:14px;padding:14px 26px;font-weight:700;font-size:20px}
.next{background:var(--orange);color:var(--text);margin-left:auto;min-width:190px;box-shadow:0 4px 0 #b05200}
.next:active{transform:translateY(2px);box-shadow:0 2px 0 #b05200}
.back{background:var(--card2);border:1px solid var(--line)}
.back:disabled{visibility:hidden}
.toc{position:fixed;inset:0;background:#14213d80;z-index:20;display:none}
.toc.show{display:block}
.toc .pan{position:absolute;right:0;top:0;bottom:0;width:min(380px,90vw);background:var(--card);border-left:1px solid var(--line);padding:20px;overflow:auto}
.toc ol{padding-left:0;list-style:none;margin:14px 0}
.toc li button{width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:10px;display:flex;gap:10px;font-size:16px}
.toc li button:hover{background:var(--card2)}
.toc li button i{font-style:normal;width:26px;height:26px;flex:none;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--orange2)}
.toc li.cur button{background:var(--card2);color:var(--text);font-weight:700}
.toc li.done button i{background:var(--green);color:#fff}
.zoom{position:fixed;inset:0;background:#14213dee;z-index:30;display:none;place-items:center;padding:16px;cursor:zoom-out}
.zoom.show{display:grid}
.zoom .shot{max-width:1280px;width:100%;cursor:zoom-out}
/* Mock-ups of Windows and Discord windows */
.mock b{color:inherit}.mock{border-radius:12px;overflow:hidden;border:1px solid #3a4560;box-shadow:0 10px 30px #0008;font-family:"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.4}
.win{background:#f3f3f3;color:#1b1b1b}
.win .tb{background:#fff;padding:8px 12px;font-size:13px;color:#444;border-bottom:1px solid #ddd;display:flex;gap:8px;align-items:center}
.win .tb span{margin-left:auto;letter-spacing:10px;color:#666}
.files{padding:14px;display:flex;gap:22px;flex-wrap:wrap;background:#fff}
.file{width:110px;text-align:center;font-size:13px;padding:8px;border-radius:6px;color:#1b1b1b;position:relative}
.file .fi{font-size:44px;line-height:1.1}
.file.sel{background:#cce4f7;outline:1px solid #99c9ef}
.file img{width:48px;height:48px}
.ctx{position:absolute;left:118px;top:40px;background:#fff;border:1px solid #ccc;border-radius:8px;box-shadow:0 6px 18px #0003;padding:4px;width:210px;text-align:left;z-index:2}
.ctx div{padding:6px 10px;border-radius:5px}
.ctx .hl{background:#e5f1fb;outline:3px solid var(--orange)}
.ss{background:#0063b1;color:#fff;padding:22px 24px;min-height:260px;display:flex;flex-direction:column}
.ss h3{font-size:24px;font-weight:600;margin:0 0 14px;color:#fff}
.ss p{margin:0 0 10px;font-size:15px}
.ss .lnk{background:none;border:0;padding:0;color:#fff;text-decoration:underline;font-size:15px;text-align:left}
.ss .row{margin-top:auto;display:flex;gap:10px;justify-content:flex-end;padding-top:16px}
.ss .row button{background:transparent;border:2px solid #fff;color:#fff;padding:6px 18px;font-size:15px}
.ss .row button.go{background:#fff;color:#0063b1;font-weight:700}
.hlbtn{outline:4px solid var(--orange)!important;outline-offset:3px;animation:pulse 1.6s infinite}
.tray{background:#1f1f1f;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:14px;justify-content:flex-end;position:relative;min-height:150px;align-items:flex-end;
background:linear-gradient(#2a3b5c,#2a3b5c) top/100% calc(100% - 56px) no-repeat,#1f1f1f}
.tray .ar{font-size:18px;padding:4px 8px;border-radius:5px}
.tray .ic{width:26px;height:26px;opacity:.85}
.tray .clock{font-size:13px;text-align:right;line-height:1.3}
.flyout{position:absolute;right:120px;bottom:60px;background:#2b2b2b;border:1px solid #444;border-radius:8px;padding:10px;display:grid;grid-template-columns:repeat(3,34px);gap:8px}
.flyout span{width:34px;height:34px;display:grid;place-items:center;border-radius:6px;font-size:18px}
.flyout img{width:26px;height:26px}
.dc{background:#313338;color:#dbdee1;display:grid;grid-template-columns:150px 1fr;min-height:250px}
.dc .side{background:#2b2d31;padding:12px 8px;font-size:14px}
.dc .side div{padding:6px 10px;border-radius:5px;color:#b5bac1}
.dc .side .on{background:#404249;color:#fff}
.dc .body{padding:16px 18px}
.dc h4{margin:0 0 10px;color:#fff;font-size:18px}
.dc .bl{display:inline-block;background:var(--blue);color:#fff;border-radius:4px;padding:6px 14px;font-weight:600;font-size:14px}
.dc .bl.red{background:#da373c}
.dc .tok{background:#1e1f22;border-radius:4px;padding:8px 10px;font-family:Consolas,monospace;color:#949ba4;margin:8px 0;font-size:13px}
.dc .sw{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid #3f4147;font-size:14px}
.dc .sw i{width:40px;height:24px;border-radius:12px;background:#80848e;position:relative}
.dc .sw i:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px}
.dc .sw i.on{background:#23a55a}.dc .sw i.on:after{left:19px}
.dc .cb{display:inline-flex;align-items:center;gap:8px;margin:4px 14px 4px 0;font-size:14px}
.dc .cb i{width:18px;height:18px;border-radius:4px;border:2px solid #80848e}
.dc .cb i.on{background:var(--blue);border-color:var(--blue)}
.dc .url{background:#1e1f22;border-radius:4px;padding:8px 10px;font-family:Consolas,monospace;font-size:12px;color:#00a8fc;margin-top:6px;word-break:break-all}
.ok{color:var(--green);font-weight:700}
.party{font-size:80px;text-align:center;margin:10px 0}
@media(max-width:720px){.ring{border-width:3px}html,body{font-size:17px}h1{font-size:27px}.grid2,.pages{grid-template-columns:1fr}
.next{min-width:0;flex:1}.big{padding:13px 18px}.dc{grid-template-columns:1fr}.dc .side{display:none}.count span{display:none}}
@media print{.top,.nav,.help>summary:before{display:none}}
</style>
</head>
<body>
<div class="top"><div class="topin">
  <div class="brand"><img src="{{img:icon}}" alt="">ScreenBuddy</div>
  <div class="count" id="count"></div>
  <a class="menu" id="lang" href="ANLEITUNG.html" style="text-decoration:none;color:var(--text)">Deutsch</a>
  <button class="menu" id="menu" aria-label="Show all steps">☰ All steps</button>
</div><div class="prog"><i id="prog"></i></div></div>

<main id="main"></main>

<div class="nav"><div class="navin">
  <button class="big back" id="back">← Back</button>
  <button class="big next" id="next">Next →</button>
</div></div>

<div class="toc" id="toc"><div class="pan"><b style="font-size:20px">All steps</b>
  <p style="color:var(--muted);font-size:15px;margin:6px 0 0">Tap a step to jump straight to it.</p><ol id="toclist"></ol></div></div>
<div class="zoom" id="zoom"></div>

<script>
/* Anonymous native 2.5 development captures. The screenshots currently show German labels and isolated sample status. */
 const IMG = {
   start: '{{img:start}}', app: '{{img:app}}', uebersicht: '{{img:uebersicht}}', discord: '{{img:discord}}', bf6: '{{img:bf6}}',
   blogs: '{{img:blogs}}', display: '{{img:display}}', bar: '{{img:bar}}', page_system: '{{img:page_system}}',
   page_blogs: '{{img:page_blogs}}', freunde: '{{img:freunde}}', ha_display: '{{img:ha_display}}', ha_setup: '{{img:ha_setup}}', ha_pick: '{{img:ha_pick}}', icon: '{{img:icon}}'};
 function shot(name, rings = [], cap = '') {
   return `<figure><span class="real">📷 Native 2.5 interface · anonymous German sample</span><div class="shot" data-zoom><img src="${IMG[name]}" alt="${cap}"></div>${cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>`;
 }
 const help = (items, title = 'Not working? Click here') =>
  `<details class="help"><summary>${title}</summary><div class="in"><dl>${items.map(([q, a]) => `<dt>${q}</dt><dd>${a}</dd>`).join('')}</dl></div></details>`;
const b = t => `<span class="btnname">${t}</span>`, g = t => `<span class="btnname grey">${t}</span>`;

/* What the user wants to see (only remembered in this browser) */
const FEAT = [
  ['system', '🖥️', 'My PC', 'How hard your processor, graphics card and memory are working right now'],
  ['discord', '💬', 'Discord friends', 'Which of your friends are online right now and what they are playing'],
  ['friends', '🎮', 'Steam and Xbox friends', 'Your friends from Steam, Xbox and Discord in one shared list'],
  ['bf6', '🎖️', 'Battlefield 6', 'A leaderboard of you and your friends'],
  ['blogs', '📰', 'News', 'The newest articles from websites you like'],
  ['streaming', '🎬', 'New on streaming', 'New movies and series on Netflix, Disney+ and more'],
  ['homeassistant', '🏠', 'Home Assistant', 'Values and switches from your smart home'],
  ['spotify', '🎵', 'Spotify', 'The song playing on Spotify right now']];
let sel = {system: true, discord: true, friends: false, bf6: true, blogs: true, streaming: false, homeassistant: false, spotify: false}, cur = 0, seen = new Set();
try { Object.assign(sel, JSON.parse(localStorage.getItem('fl-guide-sel') || '{}')); } catch (e) {}
const saveSel = () => { try { localStorage.setItem('fl-guide-sel', JSON.stringify(sel)); } catch (e) {} };

const STEPS = [
{t: 'Hello!', html: () => `
<p class="kicker">Let's go</p><h1>Hello! Let's set up ScreenBuddy together.</h1>
<p class="lead">The little display shows you things without needing a window on your big screen. For example:</p>
<div class="pages">
  <figure><div class="shot" data-zoom><img src="${IMG.page_system}" alt="System page"></div><figcaption>How hard your PC is working right now</figcaption></figure>
  <figure><div class="shot" data-zoom><img src="${IMG.page_blogs}" alt="News"></div><figcaption>New articles from your favourite websites</figcaption></figure>
</div>
<p>You always do just <b>one small step</b>. The top right shows how far you've got. When you're done, press ${b('Next →')} at the bottom.</p>
<div class="box tip"><p>If something doesn't work, every step has a <b>“Not working?”</b> button at the bottom. It tells you what you can do.</p></div>
<div class="box warn"><p>The app itself can be switched between <b>German and English</b>. In ScreenBuddy 2.9, choose <b>EN</b> at the top; in earlier 2.3.0, select <b>English</b> under <b>“Sprache · Language”</b> and save. The native screenshots below still show German labels.</p></div>`},

{t: 'What do you want to see?', html: () => `
<p class="kicker">Choose</p><h1>What should your display show?</h1>
<p class="lead">Tap what you want. The guide then only shows you the steps you need.</p>
<div class="checks">${FEAT.map(([k, ic, t, d]) => `<button class="choice${sel[k] ? ' on' : ''}" data-feat="${k}"><span class="ic">${ic}</span><span><b>${t}</b><span>${d}</span></span><span class="tick"></span></button>`).join('')}</div>
<p style="color:var(--muted)">Don't worry: you can change everything later.</p>`},

{t: 'What you need', html: () => `
<p class="kicker">Get ready</p><h1>Here's what you need</h1>
<ol class="do">
<li><b>The display</b> with its <b>USB cable</b>.</li>
<li><b>A Windows PC</b> (Windows 10 or 11, 64-bit) with internet.</li>
<li><b>The file <span class="key">ScreenBuddy.exe</span></b>. You download it in the next step. There is no ZIP to unpack.</li>
<li><b>No extra runtime for ScreenBuddy 2.9</b>. Python, WebView2 and a Visual C++ redistributable are not required. Earlier 2.3.0 still needs WebView2.</li>
${sel.discord ? '<li><b>Your Discord account</b> and a Discord server where you are the boss (admin). If you\'re not, ask the server\'s boss to help you.</li>' : ''}
${sel.friends ? '<li><b>Your Steam account</b> and/or <b>your Xbox account</b>.</li>' : ''}
${sel.bf6 ? '<li><b>The EA names</b> of you and your Battlefield friends.</li>' : ''}
</ol>
<div class="box tip"><p>You do <b>not</b> need administrator rights. The program is only installed for your own Windows account.</p></div>
<div class="box tip"><p>It's best to ask a grown-up or an older brother or sister to help when Windows asks something you don't understand.</p></div>`},

{t: 'Get the program', html: () => `
<p class="kicker">Download</p><h1>Download the program</h1>
<p class="lead">ScreenBuddy is <b>one single file</b>. There is nothing to unpack.</p>
<div class="box tip"><p><b>ScreenBuddy 2.9:</b> Download <span class="key">ScreenBuddy.exe</span>. This guide shows anonymous native example captures from the 2.5 development with German labels (the 2.9 colors & design page and status dots are described in text only); choose EN in the app for English controls. Earlier 2.3.0 uses different menus and its own bundled guide. Tip: rest the mouse on a status dot in the left list for a moment and a hint tells you whether the page is set up and on (green) or not set up or off (grey).</p></div>
<ol class="do">
<li>Open this page: <a href="https://github.com/PapaFuchs84/ScreenBuddy/releases/latest" target="_blank" rel="noopener">Latest release on GitHub</a>. Or use the file from whoever sent you this guide.</li>
<li>Download <span class="key">ScreenBuddy.exe</span> from release 2.9.0 and verify its SHA-256 using the supplied checksum file.</li>
<li>It normally lands in your <b>Downloads</b> folder.</li>
</ol>
<figure><span class="real">✏️ A mock-up, it looks roughly like this</span><div class="mock win">
<div class="tb">📁 Downloads<span>— ☐ ✕</span></div>
<div class="files"><div class="file sel hlbtn"><img src="${IMG.icon}" alt=""><br>ScreenBuddy.exe</div></div></div></figure>
<div class="box tip"><p>The file does <b>not</b> need to be in a special place. When you install, the program copies itself to the right spot.</p></div>
${help([['I can\'t find the file.', 'Look in the <b>Downloads</b> folder. You can find it in File Explorer (the yellow folder icon in the taskbar) in the list on the left.'],
  ['The browser says the file is “not commonly downloaded”.', 'The program is new and not known yet. If you got it from the right page, choose <b>Keep</b>.']])}`},

{t: 'Plug in the display', html: () => `
<p class="kicker">Connect</p><h1>Plug in the display</h1>
<ol class="do">
<li>Plug the USB cable into the display.</li>
<li>Plug the other end into your PC.</li>
</ol>
<p>The display may stay dark or show its own picture. That's fine. You'll start the program in a moment, and then it lights up.</p>
<div class="box tip"><p>Use a USB port <b>directly on the PC</b> if you can, not one on a USB hub.</p></div>`},

{t: 'Install', html: () => `
<p class="kicker">Install</p><h1>Start the program and install it</h1>
<p>Start <span class="key">ScreenBuddy.exe</span>. The examples use anonymous sample data.</p>
<ol class="do">
<li><b>Double-click</b> <span class="key">ScreenBuddy.exe</span>. That's the file with the orange icon.</li>
<li>A small window opens. It shows where the program will go: <span class="key">%LOCALAPPDATA%\FuchsLabs\USB-Display</span>, so only into your own account.</li>
<li>You can tick boxes: <b>Start with Windows</b> and <b>Start menu entry</b>. Both are a good idea.</li>
<li>Click ${b('Install')}. Wait a moment. Then it says <b>“Done! The app is starting now.”</b></li>
</ol>
<figure><span class="real">✏️ A mock-up, it looks roughly like this</span><div class="mock win">
<div class="tb">ScreenBuddy 2.9 – Installation<span>— ☐ ✕</span></div>
<div class="files" style="display:block;padding:16px;text-align:left">
<p style="margin:0 0 8px"><b>Installation · ScreenBuddy 2.9</b></p>
<p style="margin:0 0 8px">☑ Start with Windows (only the fox icon in the notification area)<br>☑ Start menu entry</p>
<p style="margin:0;text-align:right"><span class="btnname hlbtn">Install</span></p></div></div></figure>
<div class="box tip"><p><b>Did you have version 1.x?</b> Then one more tick box appears: <b>“Retire the old 1.x version”</b>. Leave it on: your settings and credentials are carried over. The old folder gets the suffix <span class="key">-1.x-alt</span> and stays as a backup.</p></div>
<h2>A blue window might pop up now</h2>
<p>Windows doesn't know the program yet (it isn't digitally signed yet) and prefers to ask once. That's normal. <b>Try it out here</b> by clicking in the window below:</p>
<figure><span class="real">✏️ For practice, this isn't the real window yet</span><div class="mock">
<div class="ss" id="ss"><h3>Windows protected your PC</h3>
<p>Microsoft Defender SmartScreen prevented an unrecognised app from starting.</p>
<button class="lnk hlbtn" id="ssmore">More info</button>
<div class="row"><button>Don't run</button></div></div></div></figure>
<p id="ssdone" class="ok" hidden>Great, that's exactly how it works! Now do the same in the real window.</p>
${help([['Nothing happens.', 'Wait 10 seconds. The program needs a moment the first time. Then look for the orange icon at the bottom right next to the clock.'],
  ['It says “Windows protected your PC” and there is no “Run anyway”.', 'Then your PC is set up strictly. Ask the grown-up who looks after the PC.'],
  ['My antivirus complains.', 'The program is new and not known yet. Ask whoever gave you the program whether everything is OK, and then allow it.'],
  ['It says the running app could not be closed.', 'Quit the old app via the fox icon at the bottom right (right-click, <b>Quit</b>) and start the installation again.']])}`,
 init: () => {
  const ss = document.getElementById('ss'), more = document.getElementById('ssmore');
  more.onclick = () => {
    more.outerHTML = '<p>App: ScreenBuddy.exe<br>Publisher: Unknown publisher</p>';
    ss.querySelector('.row').innerHTML = '<button class="go hlbtn" id="ssrun">Run anyway</button><button>Don\'t run</button>';
    document.getElementById('ssrun').onclick = () => { ss.innerHTML = '<h3>✓ Done!</h3><p>The program is starting now.</p>'; document.getElementById('ssdone').hidden = false; };
  };
 }},

{t: 'The settings page', html: () => `
<p class="kicker">Check</p><h1>The settings open by themselves</h1>
<p class="lead">After installing, a window of its own opens. That's the <b>settings page</b>. You set everything up there. It belongs only to you and isn't on the internet.</p>
<p>In the native 2.5 window, use the <b>EN</b> button at the top to switch the app to English. On <b>Overview</b>, the first card should say <b>Connected</b> for your own display. The screenshot uses German labels and an isolated sample status; it does not prove a hardware connection.</p>
${shot('start', [[286, 196, 869, 63]], 'The first card shows display status. Check the value on your own device.')}
<p>If that works, your little display lights up now too. 🎉</p>
${help([['It says “The display\'s vendor app is running”.', `Click ${g('Close vendor app')} next to it. If <b>“Vendor app autostart”</b> appears below it, click ${g('Turn off')} there. Windows then asks once whether you allow it: click <b>Yes</b>.`],
  ['It says “Display not found”.', 'Unplug the USB cable and plug it back in. Try another USB port on the PC. Then wait a few seconds.'],
  ['Published 2.3.0 says WebView2 is missing.', 'Install the <b>Microsoft Edge WebView2 runtime</b> and restart 2.3.0. ScreenBuddy 2.9 has a native settings window.'],
  ['The window didn\'t open.', 'At the bottom right next to the clock there is a small orange icon (maybe behind the arrow <span class="key">^</span>). Double-click it.'],
  ['The picture on the display is upside down.', 'No problem, you\'ll fix that in the step “Rotate picture and brightness”.']])}`},

{t: 'Start with Windows', html: () => `
<p class="kicker">Turn on</p><h1>The display should always come on by itself</h1>
<p class="lead">So you don't have to start the program yourself every time:</p>
<ol class="do"><li>Under <b>Updates &amp; Autostart</b>, turn on the <b>“Start with Windows”</b> switch. It turns orange. (If you ticked this during installation, it's already on.)</li></ol>
${shot('app', [], 'Updates &amp; Autostart. Start with Windows is disabled in this isolated test instance; it is available in the regular app.')}
<div class="box tip"><p><b>New in 2.2.0 – new version:</b> At most once a day the program checks GitHub for a newer version. If there is one, a balloon appears at the fox icon and <b>Updates &amp; Autostart</b> shows “New version available” with a link to the download page. Nothing is ever installed by itself. Use <b>Check now</b> to ask yourself; the <b>“Notify about new versions”</b> switch turns the check off.</p></div>
<div class="box tip"><p>This page also has the ${b('Open guide ↗')} button. It brings you back to this guide at any time.</p></div>
<div class="box tip"><p>From now on the program starts by itself when you sign in to Windows. It then only shows the small fox icon at the bottom right; the settings don't open on their own. You can turn it off on the same page.</p></div>`},

{t: 'Choose pages', html: () => `
<p class="kicker">Choose</p><h1>Which pages does the display show?</h1>
<p class="lead">Click <b>Pages &amp; order</b> on the left (German screenshot: <b>Seiten &amp; Reihenfolge</b>). Select and reorder pages there. The live preview remains on the right.</p>
<div class="box tip"><p>Starting with 2.0.4, use <b>Previous view</b> and <b>Next view</b> below the live preview to change the view on the display directly. The current position appears below the buttons. Long lists include their subpages. Automatic cycling continues afterwards. No save is needed.</p></div>
${shot('uebersicht', [], 'The native Pages &amp; order view with checkboxes and arrow buttons.')}
<ol class="do">
<li>Use the <b>checkbox</b> to turn a page on or off. ${['discord', 'bf6', 'blogs'].filter(k => !sel[k]).length ? 'Turn off the pages you don\'t want.' : ''}${sel.friends ? ' For Steam and Xbox, turn on <b>“Friends (all platforms)”</b>.' : ''}</li>
<li>Use the <b>arrows ▲ ▼</b> on this page to change the order.</li>
<li>Find the <b>Brightness</b> slider under <b>Display</b> (German screenshot: <b>Anzeige</b>).</li>
</ol>
<div class="box warn"><p>A bar with ${b('Save &amp; apply')} then appears at the bottom. You press it at the very end. But you can also press it now.</p></div>`},

{t: 'HDMI/USB-C and touch', html: () => `
<p class="kicker">Another display</p><h1>Set up an HDMI screen and touch</h1>
<p class="lead">This step is for a normal screen connected over HDMI or USB-C, starting with version 2.0.3. Skip it for a small USB display using a COM port.</p>
<ol class="do">
<li>Connect the screen to your PC and set Windows to <b>Extend</b>. Touch also requires the <b>USB touch connection</b>.</li>
<li>Open <b>Display</b> (German screenshot: <b>Anzeige</b>) in settings. Choose the HDMI/USB-C output under <b>Display type</b> and select the intended screen. Select <b>Save &amp; apply</b>.</li>
<li>Do taps appear on another screen? Select <b>Assign touch display</b>. The display output pauses while the Windows wizard is open.</li>
<li>Press <b>Enter</b> to skip other screens. When the wizard message appears on the intended touchscreen, touch that screen. <b>Esc</b> cancels.</li>
<li>Select <b>Check again</b> afterwards. Enable <b>Touch control</b> if needed and save. Swipe left = next page, right = previous; tap on the left = back, elsewhere = next. Tapping a blog post opens it in the browser on your PC (from 2.0.6).</li>
</ol>
<div class="box tip"><p><b>New in 2.0.7:</b> Tap a player in the Battlefield leaderboard to open their profile in the browser. Hours played now appear alongside their stats. Tap a friend: As of 2.1.0 the Steam chat with that person opens (the Steam app must be installed). Without Steam, their Discord profile opens (choose “Message” there), otherwise their Xbox profile in the browser. New windows and tabs depend on the platform app or browser. No message is sent. Swiping still changes pages.</p></div>
<div class="box tip"><p><b>New in 2.1.0 – Home Assistant:</b> Up to 4 values or switches from your smart home on the display. With touch you can flip switches and lights by tapping. Setup is in the “Home Assistant” step.</p></div>
<div class="box tip"><p><b>New in 2.2.0 – system page:</b> On the system page, tap <b>RAM</b> to open Task Manager. Tap <b>Drive</b> to open “Programs and Features”. Tap <b>Network</b> to start a speed test in the browser (speedtest.net). The processor and graphics cards do nothing.</p></div>
<div class="box tip"><p>Fullscreen stays above the taskbar without taking keyboard focus. Windows stores the touch assignment.</p></div>
<div class="box warn"><p>A disabled setup button means Windows does not detect a touchscreen. Check its USB connection and driver, then select <b>Check again</b>.</p></div>`},

{t: 'Rotate picture and brightness', html: () => `
<p class="kicker">Only if needed</p><h1>Is the picture upside down?</h1>
<p class="lead">If the picture on your display is the right way up, just press ${b('Next →')}.</p>
<p>If it's upside down:</p>
<ol class="do"><li>Click <b>Display</b> on the left (German screenshot: <b>Anzeige</b>).</li><li>Under <b>Orientation</b>, choose the other option: <b>“Landscape”</b> instead of <b>“Landscape 180°”</b> or the other way round.</li></ol>
${shot('display', [], 'Orientation is on Display, below the brightness slider.')}`},

{t: 'Colors and design', html: () => `
<p class="kicker">New in 2.9</p><h1>How should it look?</h1>
<p class="lead">If you like the colors, just press ${b('Next →')}. You can change them at any time.</p>
<ol class="do"><li>Click <b>"Colors &amp; design"</b> on the left.</li><li>Choose <b>Light</b> or <b>Dark</b> in the FuchsLabs style. Or choose <b>"Match Windows"</b>: the display then takes light or dark and the accent color from Windows and follows when you change it in Windows.</li><li>Your own colors: create a <b>theme</b>, change the colors in the editor and check the preview. The editor warns when text would be hard to read and can fix the contrast. <b>Import</b> and <b>Export</b> swap themes as a file. Three examples (in the style of Apple, Google and Microsoft interfaces) are in the <b>cpp/examples/themes</b> folder of the GitHub project. You can also find ready-made themes in the <b>Plugin store</b>, in the <b>"Themes"</b> card at the bottom: select one and click <b>Install theme</b> (colors only, checked and signed). Then pick it here.</li><li>Click ${b('Save & apply')}.</li></ol>
<div class="box tip"><p>In the list on the left, a <b>green dot</b> shows that a data source is set up and switched on. <b>Grey</b> means not set up yet or off. A legend sits at the bottom of the list.</p></div>`},

{need: 'discord', t: 'Discord 1: create a bot', html: () => `
<p class="kicker">Discord · part 1 of 3</p><h1>Make yourself a little Discord helper</h1>
<p class="lead">For the display to see who's online, it needs a <b>bot</b>. That's a helper account on Discord. You make it yourself once.</p>
<ol class="do">
<li>Open this page: <a href="https://discord.com/developers/applications" target="_blank" rel="noopener">discord.com/developers/applications</a> and sign in with your Discord account.</li>
<li>Click <span class="btnname" style="background:var(--blue);color:#fff">New Application</span> at the top right.</li>
<li>Enter a name, for example <b>My Display</b>. Tick the box for the rules and click <b>Create</b>.</li>
<li>Click <b>Bot</b> on the left.</li>
<li>Click <span class="btnname" style="background:var(--blue);color:#fff">Reset Token</span> and then <b>Copy</b>. Now the token is copied.</li>
<li>Scroll down a bit. Turn on <b>Presence Intent</b> and <b>Server Members Intent</b> (green). Click <b>Save Changes</b>.</li>
</ol>
<figure><span class="real">✏️ A mock-up, it looks roughly like this</span><div class="mock dc">
<div class="side"><div>General Information</div><div>OAuth2</div><div class="on">Bot</div><div>Emojis</div></div>
<div class="body"><h4>Bot</h4><div style="font-size:13px;color:#b5bac1">TOKEN</div>
<div class="tok">••••••••••••••••••••••••••••</div><span class="bl hlbtn">Reset Token</span>
<div style="margin-top:16px;font-size:12px;color:#b5bac1;font-weight:700">PRIVILEGED GATEWAY INTENTS</div>
<div class="sw hlbtn" style="outline-offset:0">Presence Intent <i class="on"></i></div>
<div class="sw hlbtn" style="outline-offset:0">Server Members Intent <i class="on"></i></div>
<div class="sw">Message Content Intent <i></i></div></div></div></figure>
<div class="box tip"><p>You'll also find the same steps and the ${g('Discord developer page ↗')} button on the settings page under <b>Discord</b>, in <b>“How to get the bot token”</b>.</p></div>
<div class="box secret"><p>The <b>token</b> is like a <b>password</b>. Don't show it to anyone and don't send it to anyone. You'll only paste it into your settings page in a moment.</p></div>
${help([['I lost the token.', `No problem. Just click <b>Reset Token</b> again. Then you get a new one.`],
  ['Discord asks for my password or a code.', 'That\'s Discord\'s security check. Enter it there on Discord, nowhere else.']])}`},

{need: 'discord', t: 'Discord 2: invite the bot', html: () => `
<p class="kicker">Discord · part 2 of 3</p><h1>Invite your bot to your server</h1>
<p class="lead">The bot can only see people who are on the same server as it.</p>
<ol class="do">
<li>Click <b>OAuth2</b> on the left and then <b>URL Generator</b>.</li>
<li>Under <b>Scopes</b>, tick <b>bot</b>.</li>
<li>A long address now appears at the very bottom. Click <b>Copy</b>.</li>
<li>Paste the address into your browser's address bar and press <span class="key">Enter</span>.</li>
<li>Choose your server and click <b>Authorize</b>.</li>
</ol>
<figure><span class="real">✏️ A mock-up, it looks roughly like this</span><div class="mock dc">
<div class="side"><div>General Information</div><div class="on">OAuth2</div><div>Bot</div></div>
<div class="body"><h4>OAuth2 URL Generator</h4><div style="font-size:12px;color:#b5bac1;font-weight:700">SCOPES</div>
<span class="cb">  <i></i>identify</span><span class="cb hlbtn"><i class="on"></i><b style="color:#fff">bot</b></span><span class="cb"><i></i>guilds</span><span class="cb"><i></i>email</span>
<div style="margin-top:14px;font-size:12px;color:#b5bac1;font-weight:700">GENERATED URL</div>
<div class="url">https://discord.com/oauth2/authorize?client_id=…&amp;scope=bot</div>
<div style="margin-top:8px"><span class="bl hlbtn">Copy</span></div></div></div></figure>
<p>If it worked, your bot now shows up in your server's member list (still grey, that's normal).</p>
${help([['My server isn\'t in the list.', 'You can only invite bots to servers where you are the boss (admin). Otherwise send the address to the server\'s boss. They can invite the bot for you.'],
  ['I have several servers.', 'You can open the address several times and invite the bot to each server.']])}`},

{need: 'discord', t: 'Discord 3: paste the token', html: () => `
<p class="kicker">Discord · part 3 of 3</p><h1>Give the display the token</h1>
<ol class="do">
<li>Go back to the settings page and click <b>“Discord”</b> on the left.</li>
<li>Click into the <b>Bot token</b> field and paste the token: <span class="key">Ctrl</span> + <span class="key">V</span>.</li>
<li>Press ${b('Save &amp; apply')} at the bottom. Wait about 10 seconds.</li>
<li>The people from your server now appear under <b>People</b>. Tick your friends.</li>
</ol>
${shot('discord', [], 'Bot token and people are on the native Discord page. The sample has no real token.')}
<div class="box tip"><p>If you tick <b>nobody</b>, the display shows everyone from the server. If you tick friends, only them.</p></div>
${help([['Under “People” it says “The bot is not connected right now”.', 'Check that you pasted the whole token and that in part 1 you turned the two switches (intents) green and saved. Then click <b>Save &amp; apply</b> again.'],
  ['My friends are missing from the list.', 'The bot only sees people on servers it is on itself. Invite it to the server your friends are on as well (part 2).'],
  ['Nobody shows up on the display.', 'Only people who are online right now are shown. Or turn on <b>“Show offline friends”</b>.']])}`},

{need: 'friends', t: 'Steam and Xbox', html: () => `
<p class="kicker">Steam and Xbox</p><h1>Add your Steam and Xbox friends</h1>
<p class="lead">For this the display needs a <b>key</b> for each. That's a long code that lets the app read your friends list. You only need the ones you use.</p>
<ol class="do">
<li>Click <b>“Friends”</b> on the left.</li>
<li><b>Steam:</b> fold out <b>“How to get the Steam key”</b> and click ${g('Get Steam key ↗')}. Under <b>Domain Name</b>, write <b>localhost</b>. Copy the key into the <b>Steam key</b> field.</li>
<li>Fold out <b>“How to find your profile link”</b>. ${g('My Steam profile ↗')} opens your profile. Copy the address from the top of the browser into the <b>Your Steam profile</b> field.</li>
<li>Very important: with ${g('Open privacy settings ↗')} set <b>Friends list</b> to <b>Public</b> on Steam.</li>
<li><b>Xbox:</b> fold out <b>“How to get the Xbox key”</b> and follow the steps there.</li>
<li>Click ${g('Check connection')} for each. Green means: it works. Then ${b('Save &amp; apply')}.</li>
</ol>
${shot('freunde', [], 'The native Friends page contains Steam and Xbox settings. Scroll down for more fields.')}
<div class="box secret"><p>The keys are like <b>passwords</b>. Don't show them to anyone.</p></div>
<div class="box tip"><p>Sadly there is no permitted way for PlayStation. That's why it's missing here.</p></div>
${help([['It says the friends list is private.', 'On Steam, set the friends list to <b>Public</b> (step 4) and check again.'],
  ['A friend appears twice in the list.', 'At the very bottom under <b>“Merge people”</b>, choose both accounts and click <b>Link</b>.'],
  ['Discord friends now appear twice on the display.', 'In the <b>Overview</b>, turn off the <b>“Discord friends”</b> page. The shared list already includes Discord.']])}`},

{need: 'bf6', t: 'Battlefield 6', html: () => `
<p class="kicker">Battlefield 6</p><h1>Add the Battlefield players</h1>
<p class="lead">EA doesn't tell anyone who your friends are. That's why you write the names down yourself.</p>
<ol class="do">
<li>Click <b>“Battlefield 6”</b> on the left.</li>
<li>Write your <b>EA name</b> in the field at the bottom. If you play on PlayStation or Xbox, choose that next to it.</li>
<li>Click ${g('Add')}. Do the same for each friend.</li>
<li>Click ${g('Check')} next to a name. If a <b>rank</b> appears in green, the name is correct.</li>
</ol>
${shot('bf6', [], 'Battlefield 6 settings in the native interface. Scroll down for the player list.')}
${help([['It says “Player not found”.', 'Look closely at the spelling. Upper and lower case, and zero and O, often get mixed up. Ask your friend for their exact EA name.'],
  ['My friend plays on a console.', 'When adding, choose <b>PlayStation</b> or <b>Xbox</b> to the right of the field.']])}`},

{need: 'blogs', t: 'News', html: () => `
<p class="kicker">News</p><h1>Pick some websites</h1>
<p class="lead">The display shows the newest articles from websites that often post new things (for example news sites or blogs).</p>
<ol class="do">
<li>Click <b>“Blogs”</b> on the left.</li>
<li>Copy the website's address from your browser and paste it into the field at the bottom.</li>
<li>Click ${g('Add')} and then ${g('Check')}. Green means: it works.</li>
</ol>
${shot('blogs', [], 'The native RSS page. Scroll down for addresses and the check action.')}
${help([['It says “No feed found”.', 'Some sites don\'t offer an article list for programs. Try another site, or add <span class="key">/feed/</span> to the end of the address.']])}`},

{need: 'streaming', t: 'New on streaming', html: () => `
<p class="kicker">New on streaming</p><h1>New movies and series</h1>
<p class="lead">The display shows what was released on your streaming services in the last 30 days: title, date, movie or series, and the provider logo (its abbreviation until it has loaded).</p>
<ol class="do">
<li>Create a free account on <b>themoviedb.org</b> and get your key under <b>Settings → API</b>.</li>
<li>Click <b>“New on streaming”</b> on the left, turn the page on and paste the key. It is stored encrypted.</li>
<li>Click ${g('Check key & load providers')} and tick your services in the list. Netflix, Prime Video, Disney+, Apple TV+, WOW and RTL+ are preselected.</li>
<li>The region follows the app language (German: DE, English: US). You can change it in the <b>Region</b> field.</li>
</ol>
${help([['The display says “No key”.', 'Enter the key in the settings and save. Without a key ScreenBuddy does not request anything.'], ['It says “No data”.', 'Check the key and your internet connection. Data is requested at most once an hour; older entries stay visible until then.']])}
<p style="font-size:.85em;opacity:.75">This product uses the TMDB API but is not endorsed or certified by TMDB. Provider data: JustWatch.</p>`},

{need: 'system', t: 'My PC', html: () => `
<p class="kicker">My PC</p><h1>The PC page is already running</h1>
<p class="lead">You don't need to do anything here. The page immediately shows how hard your PC is working.</p>
<figure><div class="shot" data-zoom style="max-width:520px"><img src="${IMG.page_system}" alt="System page"></div></figure>
<div class="box tip"><p><b>For pros:</b> Is there only a dash “–” for CPU temperature and fan? For that the PC needs the free program <b>HWiNFO64</b>. Install it from <a href="https://www.hwinfo.com/" target="_blank" rel="noopener">hwinfo.com</a>. Start it and turn on <b>Shared Memory Support</b> in its settings. Best ask a grown-up for help with this.</p></div>`},

{need: 'spotify', t: 'Spotify', html: () => `
<p class="kicker">Spotify</p><h1>Your song on the display</h1>
<p class="lead">The display shows the song playing on Spotify right now, with cover and progress. With touch you can also press previous, pause and next (Spotify requires a Premium account for this).</p>
<p>In landscape, the <b>Amplifier display</b> shows 16 bars from the Windows system output. Switch it off under Settings → Spotify. Analysis expires within three seconds of the last view of active playback; bars decay to zero during silence. The audio connection stays open locally; nothing is recorded or sent.</p>
<ol class="do">
<li>Create an app at <b>developer.spotify.com/dashboard</b> and tick “Web API”.</li>
<li>Enter exactly the address shown in ScreenBuddy under <b>Spotify</b> as the <b>Redirect URI</b>.</li>
<li>Copy the <b>Client ID</b> into ScreenBuddy, turn the page on and save.</li>
<li>Click <b>“Sign in to Spotify”</b> and agree in the browser.</li>
</ol>
${help([['It says “no active device”.', 'Open Spotify on your phone or PC once and play a song.'], ['The buttons do nothing.', 'Controlling needs Spotify Premium. The display works without it.']])}`},

{need: 'homeassistant', t: 'Home Assistant', html: () => `
<p class="kicker">Smart home</p><h1>Home Assistant on the display</h1>
<p class="lead">Your display shows up to <b>4 tiles</b> from your smart home: sensors, for example temperature or solar power, and with touch also switches and lights. You need Home Assistant in your home network and the app from version 2.1.0.</p>
${shot('ha_display', [], 'How the page looks on the display: two sensors and two switches.', 480, 320)}
<h2>1. Address and access token</h2>
<ol class="do">
<li>On the settings page, open the ${b('Home Assistant')} tab on the left.</li>
<li>Under ${b('Address')} enter what you use in your browser, for example <b>http://homeassistant.local:8123</b>.</li>
<li>Get a token in Home Assistant: click your <b>name</b> at the bottom left, switch to <b>Security</b> at the top, and at the very bottom under <b>Long-lived access tokens</b> click <b>Create token</b>. Enter a name, for example “Display”, click <b>OK</b> and copy the token right away. It is shown only once.</li>
<li>Paste it into ${b('Access token')}.</li>
<li>Click ${b('Check connection &amp; load entities')}. If it says “Connected” next to it, everything worked.</li>
</ol>
${shot('ha_setup', [], 'Address, access token and connection check on the native Home Assistant page.')}
<div class="box secret"><p>The <b>token</b> is like a <b>password</b> for your smart home. Show it to no one. The app stores it encrypted; only your Windows account can read it.</p></div>
<h2>2. Choose tiles</h2>
<ol class="do">
<li>Under <b>Entities</b> you see the list from Home Assistant. Type part of a name into ${b('Search entities …')}, for example “living”.</li>
<li>Click ${b('Add')} next to the value you want. At most <b>4</b> fit on the page; tiles follow the order of the list. ${b('Remove')} takes one out again.</li>
<li>Turn on ${b('Show page')} at the top and click ${b('Save &amp; apply')} at the bottom.</li>
</ol>
<p>The entity selector is farther down on the same page. Scroll down in the middle panel.</p>
<div class="box tip"><p><b>Switches</b> (switches, lights, fans, input booleans) can only be chosen if a touch screen is connected and <b>Touch control</b> is on (<b>Display</b> tab, see step “HDMI/USB-C and touch”). A tap on the tile then flips the switch. Without touch only sensors remain. Locks, covers and alarm systems deliberately cannot be switched.</p></div>
${help([['Home Assistant is not reachable.', 'Check the address and that your PC and Home Assistant are on the same network. If you only use “homeassistant.local”, try the IP address, for example <b>http://192.168.1.20:8123</b>.'],
  ['Token invalid or expired.', 'In Home Assistant create a new long-lived token under <b>Security</b> and paste it in.'],
  ['Address is wrong (no API found).', 'Use Home Assistant’s own address with its port, for example <b>:8123</b>, and no path after it.'],
  ['My switch is missing from the list.', 'Switches only appear when touch is active. Turn on <b>Touch control</b> under <b>Display</b>.'],
  ['The page does not appear on the display.', `The page is only shown once it is switched on and address, token and at least one tile are filled in. Then do not forget ${b('Save &amp; apply')}.`]])}`},

{t: 'Plugin store', html: () => `
<p class="kicker">Optional · Plugins</p><h1>Get extra plugins from the store</h1>
<p class="lead">The plugin store offers reviewed extra pages for your display, for example clock, weather, a Pomodoro board or a game night. You do not need it to use ScreenBuddy.</p>
<ol class="do">
<li>In the settings, open the <b>Plugin store</b> page. It sits next to <b>Companion</b> and <b>Plugins</b>.</li>
<li>The switch <b>Use the plugin store</b> is on by default. When it is off, the program fetches nothing from the store; other data sources keep running. The change only takes effect after <b>Save &amp; apply</b>.</li>
<li>Search with the <b>Search</b> field or choose a category.</li>
<li>Click a plugin. Under <b>Details</b> you see author, version, licence and status.</li>
<li>Read the line “This plugin sends data to …”. If you agree, click <b>Install</b>.</li>
</ol>
<div class="box warn"><p>An installed plugin stays <b>off</b>. Turn it on deliberately on the <b>Plugins</b> page and allow every host it sends data to. On an update all approvals are reset; check the hosts again then.</p></div>
<div class="box tip"><p><b>Want to build your own plugin?</b> The <a href="/plugin-werkstatt?lang=en" target="_blank">Plugin Workshop</a> guides you step by step with a builder, live preview and bug detective.</p></div>
<p>The program switches off revoked plugins automatically. Without internet the store shows the last checked state. Click <b>Refresh store</b> to get the newest state.</p>
${help([['The store says “not reachable”.', 'Check your internet connection and click <b>Refresh store</b>.'],
  ['The store says “not available”.', 'This version has no signing key for the store. Use the current version from the download page.'],
  ['I cannot find a plugin.', 'Choose the category <b>All</b> and clear the search text.']])}`},

{t: 'Save', html: () => `
<p class="kicker">Very important</p><h1>Don't forget to save!</h1>
<p class="lead">When you've changed something, a bar appears at the bottom of the settings page.</p>
${shot('bar', [], 'Save &amp; apply is at the bottom right of the native window.')}
<ol class="do">
<li>Press ${b('Save &amp; apply')}.</li>
<li>Wait about <b>10 seconds</b>. The display restarts briefly.</li>
<li>Done! Your display now shows your pages, one after the other.</li>
</ol>
<div class="box warn"><p>If you close the window without saving, your change is lost.</p></div>`},

{t: 'Find it again', html: () => `
<p class="kicker">Later</p><h1>How to find the settings again</h1>
<p class="lead">The program runs quietly in the background. It has a small <b>orange icon</b> at the bottom right next to the clock.</p>
<div class="box tip"><p><b>ScreenBuddy 2.9:</b> The native interface already includes the phase-2 pages for Discord, friends, Home Assistant, Companion pairing with QR code and device management, and Colors &amp; design. The source editor, page ordering, updates and autostart are also available natively. All settings open in the native window; this illustrated HTML guide remains available in the browser. Source plugins require their settings and approval for every host. Earlier 2.3.0 uses the previous interface.</p></div>
<figure><span class="real">✏️ A mock-up, it looks roughly like this</span><div class="mock">
<div class="tray"><div class="flyout"><span>☁️</span><span class="hlbtn"><img src="${IMG.icon}" alt=""></span><span>🎧</span></div>
<span class="ar hlbtn">^</span><span>📶</span><span>🔊</span><div class="clock">14:05<br>22/10/2026</div></div></div></figure>
<ol class="do">
<li>Can't see the icon? Click the little arrow <span class="key">^</span>.</li>
<li><b>Double-click</b> the orange icon. The settings open.</li>
<li>With a <b>right-click</b> on the icon you see: <b>Open settings</b>, <b>Open guide</b>, <b>Restart</b> and <b>Quit</b>. <b>Open guide</b> shows this guide in your browser, even without the settings window. The <b>Open guide</b> button in the settings also opens it in your browser, so you can keep both side by side.</li>
<li>If you ticked the Start menu entry, you'll also find the program there: <b>ScreenBuddy</b> (version 2.3.0: <b>FuchsLabs USB-Display</b>).</li>
</ol>
<div class="box tip"><p>Closing the window only hides the settings. The display keeps running.</p></div>`},

{t: 'Done!', html: () => `
<div class="party">🎉</div>
<h1 style="text-align:center">You did it! Your display is ready.</h1>
<p class="lead" style="text-align:center">You've set everything up. Now you can watch the pages change.</p>
<h2>If something doesn't work later</h2>
${help([['The display stays dark.', 'Check whether the orange icon is at the bottom right. If not: open the program from the Start menu (or double-click the EXE). Then check display status on <b>Overview</b>.'],
  ['The picture looks shifted or strange.', 'Briefly unplug the cable and plug it back in. Or click <b>Restart</b> on the <b>Display</b> page.'],
  ['The display is too dark.', 'On the <b>Display</b> page, slide <b>Brightness</b> to the right, then <b>Save &amp; apply</b>.'],
  ['I want to get rid of the program.', 'Open Windows <b>Settings → Apps</b>, choose <b>ScreenBuddy</b> (version 2.3.0: <b>FuchsLabs USB-Display</b>) and click <b>Uninstall</b>. Windows asks whether your settings and credentials should be deleted too.']], 'Help with problems')}
<p style="color:var(--muted);margin-top:26px;text-align:center">Have fun! · © 2026 FuchsLabs</p>`},
{t: 'Companion: independent phone display', html: () => `<h1>USB display and phone at the same time</h1><p class="lead">Companion preview from version 2.3.0: both outputs have their own pages and timers.</p><ol><li>Keep the USB/HDMI display type. Enable Companion in its tab, then save and apply.</li><li>Install the Companion app (separate download; on Android TV it appears in the TV launcher, and left/right on the remote switches the page). An older debug APK uses a different certificate and cannot be directly updated; agree on backup and migration before uninstalling it. A fresh installation needs pairing again. Use the same private network or USB tethering. Pair with the local code and compare the certificate fingerprint.</li><li>Choose pages and timing under Companion → Independent Companion display. Choose the other output under Display → Pages on USB display / monitor.</li><li>The extra controls appear only while Companion is enabled. Enable and configure each data source in its own tab.</li></ol><p>Swiping changes only the phone view. Native resolution follows connection and rotation. The first connected phone determines the shared Companion size; other phones share its pages. Larger requests are reduced proportionally to 2560 pixels per edge / 4,194,304 pixels. Real Redmi output, injected gestures and reconnect were tested over USB tethering with the predecessor 0.2.1-preview. The user also confirmed sharp output, finger swipes and taps. Wi-Fi and physical USB output in the same new PC instance need separate acceptance.</p>`}
];

const $ = s => document.querySelector(s);
if (location.protocol !== 'file:') $('#lang').href = '/anleitung?lang=de';
const active = () => STEPS.filter(s => !s.need || sel[s.need]);
function show(i) {
  const list = active(); cur = Math.max(0, Math.min(i, list.length - 1)); const s = list[cur];
  seen.add(s.t);
  $('#main').innerHTML = `<section class="step">${s.html()}</section>`;
  s.init && s.init();
  $('#count').innerHTML = `<span>Step </span><b>${cur + 1}</b> of ${list.length}`;
  $('#prog').style.width = ((cur + 1) / list.length * 100) + '%';
  $('#back').disabled = cur === 0;
  $('#next').textContent = cur === list.length - 1 ? 'Start again ↺' : 'Next →';
  document.title = `${s.t} · Set up ScreenBuddy`;
  try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
  window.scrollTo({top: 0});
  $('#main').querySelectorAll('[data-feat]').forEach(el => el.onclick = () => {
    sel[el.dataset.feat] = !sel[el.dataset.feat]; el.classList.toggle('on', sel[el.dataset.feat]); saveSel(); });
  $('#main').querySelectorAll('[data-zoom]').forEach(el => el.onclick = () => {
    $('#zoom').innerHTML = el.outerHTML; $('#zoom').classList.add('show'); });
}
$('#next').onclick = () => show(cur === active().length - 1 ? 0 : cur + 1);
$('#back').onclick = () => show(cur - 1);
$('#zoom').onclick = () => $('#zoom').classList.remove('show');
$('#menu').onclick = () => {
  const list = active();
  $('#toclist').innerHTML = list.map((s, i) => `<li class="${i === cur ? 'cur' : seen.has(s.t) ? 'done' : ''}"><button data-go="${i}"><i>${seen.has(s.t) && i !== cur ? '✓' : i + 1}</i>${s.t}</button></li>`).join('');
  $('#toclist').querySelectorAll('[data-go]').forEach(b => b.onclick = () => { $('#toc').classList.remove('show'); show(+b.dataset.go); });
  $('#toc').classList.add('show');
};
$('#toc').onclick = e => { if (e.target.id === 'toc') $('#toc').classList.remove('show'); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('#zoom').classList.remove('show'); $('#toc').classList.remove('show'); }
  if (['INPUT', 'TEXTAREA', 'BUTTON'].includes(document.activeElement.tagName) && e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  if (e.key === 'ArrowRight') $('#next').click(); if (e.key === 'ArrowLeft' && cur > 0) show(cur - 1);
});
const fromHash = () => show((parseInt(location.hash.slice(1)) || 1) - 1);
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
</body>
